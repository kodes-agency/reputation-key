# BQC-7.7 — grype ignore rules for the container scanning gate (ci.yml
# `docker` job, anchore/scan-action with fail-build: true,
# severity-cutoff: high; policy: docs/operations/security-ci-policy.md).
#
# Zero exceptions is the target. Before any entry below is written, every
# finding WITH a fix is fixed: the base is node:22.23.5-trixie-slim (Debian 13,
# plan revision R2, 2026-09-07; bookworm was EOL), the npm CLI is stripped from
# every runtime stage, and OpenSSL is pinned to the patched 3.5.7-1~deb13u3 in
# every Dockerfile base stage (nine CVEs incl. CVE-2026-63073 / CVE-2026-75803
# Critical — the only fixable class trixie shipped with — plus DSA-6531-1's
# thirteen, 2026-09-30, incl. CVE-2026-72897 / -84782 / -84784 High). What
# remains is marked won't-fix / not-fixed by Debian for trixie as well; the
# base swap did not clear these, it only moved their package versions. Every
# entry carries owner/reason/expiresAt and is re-justified at the quarterly
# review and on every base-image bump. grype has no native expiry, so the
# dates are enforced by `pnpm check:container-images`
# (scripts/ci/grype-exception-expiry.ts): each rule takes the one
# `expiresAt: YYYY-MM-DD` in the comment block directly above it — no blank
# line between — and the gate fails the day after that date, or when a rule
# has no such date. The gate reads lines while grype reads YAML, so keep the
# one shape below: this plain `ignore:` key, then one `- ` item per rule on
# its own line. A flow list, an alias, a quoted key or a line that belongs to
# no rule fails the gate. A new entry needs the finding named (package, CVE,
# grype's own identity line).

ignore:
  # ── Debian trixie base packages, perl-base 5.40.1-6+deb13u1 (2 CVEs) ──
  # owner: platform — reason: Debian leaves these two unfixed for trixie
  # (tracker read 2026-11-25: CVE-2026-9538 `postponed`, minor issue, fixed
  # only in forky/sid 5.44.0-3; CVE-2026-82560 `<no-dsa>` minor issue, no fixed
  # Debian package in any release, the fix exists only upstream as podlators
  # 6.1.1). A scan of the pinned base on 2026-11-25 reports no other perl-base
  # finding, so the eleven other perl CVEs that used to sit in this group are
  # gone from the file. CVE-2026-82560: Pod::Text loops without consuming input
  # on deeply nested `=over` blocks, exhausting CPU and memory while formatting
  # POD. perl-base is dpkg infrastructure only: the CMD is node, nothing in the
  # image runs perl or formats POD. Renewed 2026-11-25: `apt-cache policy
  # perl-base` in the pinned base offers only 5.40.1-6+deb13u1. Drop these at
  # the first trixie perl update that fixes them. expiresAt: 2026-12-21
  - vulnerability: CVE-2026-9538 # postponed, minor issue (fixed in forky/sid only)
  - vulnerability: CVE-2026-82560 # no-dsa, minor issue (unfixed in every Debian release)

  # ── glibc 2.41-12+deb13u5 gettext LANGUAGE paths: no fix anywhere (1 CVE) ─
  # owner: platform — reason: CVE-2026-84243 (added 2026-10-31, first reported
  # by the grype DB the PR #1046 scan used): `libc-bin`/`libc6`
  # 2.41-12+deb13u5 deb CVE-2026-84243 High, no fixed version. The gettext
  # family accepts LANGUAGE entries containing "/" or "..", so whoever controls
  # LANGUAGE can make a program load a message catalog from any path, and a
  # crafted .mo file can crash it or run code; it also needs another installed
  # locale selected through LANG or LC_ALL (GLIBC-SA-2026-0025). The Debian
  # tracker (read 2026-10-31) lists bookworm, trixie, forky and sid all
  # vulnerable and unfixed (bug 1152640), so there is nothing to pin. Renewed
  # 2026-11-25: the tracker still lists trixie 2.41-12+deb13u5 and forky/sid
  # 2.43-7 vulnerable with no fixed version (`<no-dsa>`, minor issue), and the
  # base pins the newest trixie glibc. In the
  # images nobody but the deployment sets the environment, no locale beyond the
  # slim base's C locale is installed, and the CMD is node, which takes its
  # messages from its bundled ICU, not gettext. Drop this entry at the first
  # trixie glibc update that fixes it. expiresAt: 2026-12-21
  - vulnerability: CVE-2026-84243 # gettext LANGUAGE path traversal, unfixed in every Debian release

  # ── libgcc-s1 / libstdc++6 / gcc-14-base 14.2.0-19: no fix yet (1 CVE) ─
  # owner: platform — reason: CVE-2026-102010 (High) appeared in grype's
  # database 2026-10-01 against the gcc-14 runtime libraries with no fixed
  # version on trixie. Nothing to pin. The images run node, which links
  # libstdc++/libgcc_s as runtime support only; there is no compiler in the
  # image and the CVE is matched by package, not by a reachable code path
  # from the app. Drop this entry at the first trixie gcc-14 update that
  # fixes it. Extended 2026-10-01: the Debian tracker lists every release
  # vulnerable with no fixed package, and apt in the pinned base offers only
  # 14.2.0-19. Renewed 2026-11-16: the scan still matches only 14.2.0-19 and
  # no newer trixie gcc-14 build is available to pin. Renewed 2026-11-25: the
  # Debian tracker still lists trixie gcc-12, gcc-13 and gcc-14 (14.2.0-19)
  # vulnerable, `<no-dsa>` minor issue, with fixes only in forky/sid
  # (gcc-14 14.4.0-3), and `apt-cache policy` in the pinned base and in the
  # 2026-11-24 rebuild of node:22.23.5-trixie-slim still offers only
  # 14.2.0-19; grype's 2026-11-25 database matches that version. expiresAt: 2026-12-21
  - vulnerability: CVE-2026-102010

  # ── libgcc-s1 / libstdc++6 / gcc-14-base 14.2.0-19: second unfixed CVE ──
  # owner: platform — reason: CVE-2026-95619 (High) appeared in grype's
  # database 2026-10-03 against the same gcc-14 runtime libraries, with no
  # fixed version on trixie (grype: `gcc-14-base` / `libgcc-s1` /
  # `libstdc++6` 14.2.0-19 deb CVE-2026-95619 High, no fixed version).
  # Nothing to pin. Same exposure as CVE-2026-102010 above: node links
  # libstdc++/libgcc_s as runtime support only and the image has no
  # compiler. Scoped to version 14.2.0-19 (all three packages share it) so
  # a different gcc-14 build is re-scanned; not scoped by name because
  # grype reads a package name as a regular expression and `libstdc++6`
  # never matched. Drop at the first trixie gcc-14 update that fixes it.
  # Renewed 2026-10-18: packages.debian.org still lists trixie gcc-14 at
  # 14.2.0-19, so there is no newer build to pin, and the scan still matches
  # only that version (the Debian tracker did not answer that day). Renewed
  # 2026-11-16 on the same grounds as CVE-2026-102010 above. Renewed
  # 2026-11-25: the tracker still lists trixie gcc-14 14.2.0-19 vulnerable
  # (`<no-dsa>`, minor issue; fixed in forky/sid from 14.4.0-3), so there is no
  # trixie build to pin. expiresAt: 2026-12-21
  - vulnerability: CVE-2026-95619
    package:
      version: 14.2.0-19
      type: deb

  # ── Debian trixie base packages, misc (3 CVEs) ─────────────────────────
  # owner: platform — reason: won't-fix by Debian triage; the libs are unused
  # by the app runtime (no ncurses/libacl calls from node, which links
  # neither). Renewed 2026-11-25: `apt-cache policy` in the pinned base offers
  # only the installed ncurses 6.5+20250216-2 and libacl1 2.3.2-2+b1, and
  # grype's 2026-11-25 database still lists both won't-fix. The other four
  # entries of this group (gzip CVE-2026-41992, libsqlite3-0 CVE-2026-11822 and
  # CVE-2026-11824, libpcre2-8-0 CVE-2026-86145) no longer match anything in
  # the scanned base and were removed. expiresAt: 2026-12-21
  - vulnerability: CVE-2025-69720 # ncurses 6.5+20250216-2, wont-fix
  - vulnerability: CVE-2026-54369 # libacl1 2.3.2-2+b1, wont-fix
  - vulnerability: CVE-2026-54370 # libacl1 2.3.2-2+b1, wont-fix

  # ── libsqlite3-0 3.46.1-7+deb13u2: no trixie fix (3 CVEs) ─────────────
  # owner: platform — reason: first reported by the grype DB of 2026-11-03 on
  # PR #1069's scan: `libsqlite3-0 3.46.1-7+deb13u2 deb CVE-2026-119373 /
  # -119374 / -119379 High`, heap overflows reached through a crafted FTS5
  # index or session changeset. The Debian tracker (read 2026-11-03) lists
  # trixie vulnerable and `<no-dsa> (Minor issue)`; the fix is only in sid
  # (3.54.1-1), so there is nothing to pin. As in the section above, node has no
  # call into the system SQLite, and the application's database is PostgreSQL.
  # Drop these at the first trixie sqlite3 update that fixes them. Renewed
  # 2026-11-25: the tracker (read that day) still lists trixie 3.46.1-7+deb13u2
  # vulnerable, `<no-dsa>` minor issue, fixed only in forky/sid (3.54.1-2), and
  # `apt-cache policy libsqlite3-0` in the pinned base offers nothing newer.
  # expiresAt: 2026-12-21
  - vulnerability: CVE-2026-119373 # FTS5 fts5MergeRowidLists
  - vulnerability: CVE-2026-119374 # FTS5 fts5DoSecureDelete
  - vulnerability: CVE-2026-119379 # session extension sessionUpdateFind

  # ── Debian trixie base packages, util-linux 2.41.5-0+deb13u1 (4 CVEs) ──
  # owner: platform — reason: won't-fix on trixie (util-linux is fixed only in
  # unstable); `apt-cache policy util-linux` in the pinned base offers nothing
  # newer than the installed 2.41.5-0+deb13u1 (checked 2026-11-25), and grype's
  # 2026-11-25 database still lists all four won't-fix. The reachable surface
  # was removed rather than excepted: the four CVEs are local escalation
  # through setuid mount helpers; every production runtime stage drops every
  # setuid/setgid bit (`RUN find / -xdev -perm /6000 -type f -exec chmod ug-s
  # {} +`), and the processes run as a non-root user with no CAP_SYS_ADMIN.
  # The zlib1g entries are gone: trixie ships 1:1.3.dfsg+really1.3.1-1+deb13u1,
  # which the base stage now pins and which fixes CVE-2026-85091; CVE-2026-76844
  # no longer matches. expiresAt: 2026-12-21
  - vulnerability: CVE-2026-76642 # util-linux, no trixie fix
  - vulnerability: CVE-2026-78408 # util-linux, no trixie fix
  - vulnerability: CVE-2026-78409 # util-linux, no trixie fix
  - vulnerability: CVE-2026-78410 # util-linux, no trixie fix

  # ── Debian trixie base packages, libssl3t64 / openssl-provider-legacy
  #    3.5.7-1~deb13u3: no fix yet (7 CVEs) ───────────────────────────────
  # owner: platform — reason: CVE-2026-107496, CVE-2026-88823, CVE-2026-95691
  # and CVE-2026-95692 (all High) appeared in grype's database on 2026-11-17
  # against libssl3t64 and openssl-provider-legacy 3.5.7-1~deb13u3 (grype:
  # `libssl3t64 3.5.7-1~deb13u3 deb CVE-2026-107496 High`, likewise for the
  # other three and for openssl-provider-legacy) with no fixed version, and apt
  # in the pinned base offers nothing newer than the 3.5.7-1~deb13u3 every base
  # stage already pins (checked 2026-11-17). The application cannot reach the
  # system library: the runtime CMD is node, whose OpenSSL is its own bundled
  # 3.5.9 (`node_shared_openssl: false`; the node binary links no libssl or
  # libcrypto); on trixie the system library serves apt, libapt-pkg and the
  # coreutils hash tools, none of which a runtime process runs. Bump the pin
  # and drop this entry at the first trixie OpenSSL update that fixes them.
  # CVE-2026-107493 and CVE-2026-124709 (both High) were added by grype's
  # database of 2026-11-19 (grype: `libssl3t64 3.5.7-1~deb13u3 deb
  # CVE-2026-107493 High`, likewise CVE-2026-124709 and for
  # openssl-provider-legacy), also with no fixed version; apt in the new pinned
  # base (node:22.23.5-trixie-slim) still offers only 3.5.7-1~deb13u3 (checked
  # 2026-11-19). Same reachability argument as above. CVE-2026-84786 (High)
  # was added by grype's database of 2026-11-20 (grype: `libssl3t64
  # 3.5.7-1~deb13u3 deb CVE-2026-84786 High`, likewise for
  # openssl-provider-legacy), with no fixed version; apt in the pinned base
  # still offers only 3.5.7-1~deb13u3 (checked 2026-11-20). Same reachability
  # argument as above. CVE-2026-121482 (High) was added by grype's database of
  # 2026-11-22 (grype: `libssl3t64 3.5.7-1~deb13u3 deb CVE-2026-121482 High`,
  # likewise for openssl-provider-legacy), with no fixed version. Trixie now
  # offers 3.5.9-1~deb13u1, but grype v0.116.1 reports this CVE and the seven
  # above against 3.5.9-1~deb13u1 as well, with no fixed version (checked
  # 2026-11-22 on the pinned base with 3.5.9 installed), so the pin stays.
  # Same reachability argument as above. CVE-2026-107494 (High) was added by
  # grype's database of 2026-11-24 against the same packages, with no fixed
  # version; same reachability argument. Renewed 2026-11-25: the Debian
  # tracker lists CVE-2026-121482 and CVE-2026-107494 vulnerable with no fixed
  # version in trixie (3.5.9-1~deb13u1) and trixie-security (3.5.7-1~deb13u3),
  # forky and sid (3.6.5-1); the 2026-11-24 rebuild of
  # node:22.23.5-trixie-slim ships 3.5.9-1~deb13u1 and a grype scan of it with
  # the 2026-11-25 database reports all nine CVEs here against 3.5.9 too with no
  # fixed version, so neither the pin nor a newer base clears them.
  # expiresAt: 2026-12-21
  - vulnerability: CVE-2026-107496 # libssl3t64 / openssl-provider-legacy, no trixie fix
  - vulnerability: CVE-2026-88823 # libssl3t64 / openssl-provider-legacy, no trixie fix
  - vulnerability: CVE-2026-95691 # libssl3t64 / openssl-provider-legacy, no trixie fix
  - vulnerability: CVE-2026-95692 # libssl3t64 / openssl-provider-legacy, no trixie fix
  - vulnerability: CVE-2026-107493 # libssl3t64 / openssl-provider-legacy, no trixie fix
  - vulnerability: CVE-2026-124709 # libssl3t64 / openssl-provider-legacy, no trixie fix
  - vulnerability: CVE-2026-84786 # libssl3t64 / openssl-provider-legacy, no trixie fix
  - vulnerability: CVE-2026-121482 # libssl3t64 / openssl-provider-legacy, no trixie fix
  - vulnerability: CVE-2026-107494 # libssl3t64 / openssl-provider-legacy, no trixie fix
