# Optional: only used by the Orca app (https://github.com/stablyai/orca). Nothing
# else reads it; setup without Orca is in README.md.
# The setup script runs in each new Orca worktree (cwd = the new worktree).
scripts:
  setup: |
    set -euo pipefail
    cd "${ORCA_WORKTREE_PATH:-$PWD}"

    # Orca is a GUI app and may lack the shell's PATH; take it from a login shell.
    PATH="$("${SHELL:-/bin/sh}" -lc 'printf %s "$PATH"' 2>/dev/null || printf %s "$PATH")"
    export PATH

    # Node is pinned by .nvmrc (engines: 22.23.x). Use fnm when it is installed;
    # otherwise the node already on PATH must match.
    if command -v fnm >/dev/null 2>&1; then
      eval "$(fnm env --shell bash)"
      fnm use --install-if-missing
    fi
    command -v pnpm >/dev/null 2>&1 || corepack enable pnpm

    echo "orca setup: node $(node -v), pnpm $(pnpm -v)"
    pnpm install --frozen-lockfile
