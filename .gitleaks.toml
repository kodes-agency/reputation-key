[[allowlists]]
description = "Detector test fixtures"
condition = "AND"
regexTarget = "secret"
paths = [
  '''^src/shared/ai-structured-marker-detectors(-v1\.vectors\.json|\.test\.ts)$''',
]
regexes = [
  '''^sk_test_1234567890abcdefghijklmnop$''',
]

[[allowlists]]
description = "CI dummy credentials"
condition = "AND"
regexTarget = "secret"
paths = [
  '''^\.github/workflows/(ci|simulation)\.yml$''',
]
regexes = [
  '''^test-secret-at-least-32-characters-long-for-ci$''',
]

[[allowlists]]
description = "Environment variable names listed in source"
condition = "AND"
regexTarget = "secret"
paths = [
  '''^(src/shared/config/production-secrets\.ts|\.railway/railway\.ts|services/ai-egress-gateway/runtime-secrets\.ts|services/ai-execution-admission/environment\.ts)$''',
]
regexes = [
  '''^AI_ADMISSION_ED25519_KID$''',
  '''^AI_ADMISSION_ED25519_PRIVATE_KEY_B64$''',
  '''^AI_INTERNAL_MTLS_CA_B64$''',
]

[[allowlists]]
description = "Seed badge key"
condition = "AND"
regexTarget = "secret"
paths = [
  '''^src/contexts/badge/domain/seed-badges\.ts$''',
]
regexes = [
  '''^avg_rating_45_this_month$''',
]

[[allowlists]]
description = "Documentation examples"
condition = "AND"
regexTarget = "secret"
paths = [
  '''^docs/(product-readiness-program-2026-07/(beta-readiness-audit-2026-07-14|post-beta-4-recognition-activity-and-notifications-plan)|superpowers/plans/2026-05-05-gbp-import)\.md$''',
]
regexes = [
  '''^ENCRYPTION_KEY=$''',
  '''^audience/visibility$''',
  '''^bounce/complaint$''',
  '''^delivery/bounce/complaint$''',
]

# One throwaway session ID, repeated in a design-tool log that is gitignored
# today and survives only in history.
[[allowlists]]
description = "Local design-tool session ID"
condition = "AND"
regexTarget = "secret"
paths = [
  '''^\.impeccable/live/sessions/[0-9a-f]+\.jsonl$''',
]
regexes = [
  '''^0f0af46b-4ed3-4d4b-b00e-7658f5de370e$''',
]
