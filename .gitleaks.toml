# Secret scanning for the `secrets` CI check and the weekly history scan; see
# docs/operations/security-ci-policy.md. Detection uses gitleaks' default rules.
# The allowlists below clear known placeholders and nothing else: each one needs
# a path AND a value, so a fixture can move between files but a new value in the
# same file is still reported. For a new test fixture, put `gitleaks:allow` in a
# comment on its line instead of adding an entry here.

title = "Reputation Key secret scanning"

[extend]
useDefault = true

# Committed artifacts of generated tooling output (a binary cache and a graph
# dump) that dominate scan time and hold no credentials.
[[allowlists]]
description = "Generated binary and dependency-graph artifacts"
paths = [
  '''^\.fallow/cache\.bin$''',
  '''^graphify-out/graph\.json$''',
]

# A content digest is a SHA-256 under a fixed key name inside an AI contract
# migration, so a new one needs no entry here.
[[allowlists]]
description = "Content digests in database migrations"
condition = "AND"
regexTarget = "match"
paths = [
  '''^drizzle/[0-9]{4}_[^/]+\.sql$''',
  '''^src/shared/db/db-constructs\.sql$''',
]
regexes = [
  '''^static_token_bearing_digest"?(?::\s*|\s*=\s*)["']?[0-9a-f]{64}["']?$''',
]

[[allowlists]]
description = "Test tokens and fixtures"
condition = "AND"
regexTarget = "secret"
paths = [
  '''^(src|scripts|services)/.*\.(test\.tsx?|stories\.tsx?)$''',
  '''^src/contexts/feed/infrastructure/jobs/test-fixtures\.ts$''',
]
regexes = [
  '''^0123456789abcdef0123456789abcdef$''',
  '''^0b6d1c1e-52c4-4b34-9d63-6e3b4a1f9a10$''',
  '''^3f6f0a2e-0b4f-4c1e-9a71-1d2c3b4a5e71$''',
  '''^41e0b7d5c2a9$''',
  '''^75ac1ad819c920c34cf625254dd75d9de73720644bf3808e1ac7ee183645cfa3$''',
  '''^7K3QZ0VD9MWX4HT2BN6R$''',
  '''^7f3c9a2e4b81$''',
  '''^ChVyZWRpcmVjdF91cmlfbWlzbWF0Y2gSsAEKWW91IGNhbid0IHNpZ24gaW4gdG8gdGhpcyBhcHAgYmVjYXVzZSBpdCBkb2Vzbid0IGNvbXBseSB3aXRoIEdvb2dsZSdzIE9BdXRoIDIuMCBwb2xpY3ku$''',
  '''^GOCSPX-9f4c2e7a1b8d4e6f0a3c5b7d$''',
  '''^MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgdJ\+5iAcRMRndF/sSYhw17vACCGNzQcIpdzwGUrtLBNShRANCAAQzRY9jxjBk88SNueblXp7DzyV0n6vWeCE8DJpMmVapUSJYr8rsbYkAF0DXTJo4ftzTtjIsUOiDJ2/y2kNrvjNs$''',
  '''^Zk3vQ9d1LmX0aB7cR2tY5uWe$''',
  '''^a2b9f990dcff2405f6b5a14b6ab414aff9e0f9d17f3b35f1c1ba558583c9e1e0$''',
  '''^ab496f49215a28de0ad1c0b924d63b3a027945e1d0fa6282db999a063bd44894$''',
  '''^ai-enrollment-test-v1$''',
  '''^ai-foundation-enable-v1$''',
  '''^ai-operation-enable-v1$''',
  '''^ai-reanalyze-admission-broken-pilot-v6$''',
  '''^ai-reanalyze-admission-enable-v1$''',
  '''^ai-reanalyze-admission-enable-v5$''',
