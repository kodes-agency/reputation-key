name: ${COMPOSE_PROJECT_NAME}
x-health: &health { interval: 2s, timeout: 3s, retries: 60 }
x-runtime: &runtime
  init: true
  restart: on-failure
  networks: [app]
x-app-environment: &app-environment
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
x-app-dependencies: &app-dependencies
  postgres: { condition: service_healthy }
  redis: { condition: service_healthy }
  provider-sandbox: { condition: service_healthy }
  ai-provider-stub: { condition: service_healthy }
  mail-stub: { condition: service_healthy }
x-app: &app
  <<: *runtime
  image: repkey-local-web:${SOURCE_REVISION}
  build:
    {
      context: .,
      dockerfile: Dockerfile,
      args: { SOURCE_REVISION: '${SOURCE_REVISION}' },
    }
  env_file: [e2e/stack.env]
  depends_on: *app-dependencies
x-stub: &stub
  <<: *runtime
  image: repkey-local-provider:${SOURCE_REVISION}
  build:
    {
      context: .,
      dockerfile: Dockerfile.sandbox,
      args: { SOURCE_REVISION: '${SOURCE_REVISION}' },
    }

# The explicit service inventory stays compact enough to audit in one screen.
# prettier-ignore
services:
  postgres:
    image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    environment: { POSTGRES_DB: "${POSTGRES_DB}", POSTGRES_USER: "${POSTGRES_USER}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}" }
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT}:5432"]
    healthcheck:
      <<: *health
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [app]
  redis:
    image: redis:7@sha256:595cc6f2bb3af6e03347b90deb6123c6aa2c81dea05ce08128de8a174b6ac67b
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    ports: ["127.0.0.1:${REDIS_HOST_PORT}:6379"]
    healthcheck: { <<: *health, test: [CMD, redis-cli, ping] }
    volumes: [redis-data:/data]
    networks: [app]
  provider-sandbox:
    <<: *stub
    environment: { BQC_STUB_KIND: gbp, PORT: "4100", BQC_STUB_HOST: 0.0.0.0 }
    ports: [127.0.0.1:4100:4100]
    healthcheck:
      <<: *health
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4100/__control/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  ai-provider-stub:
    <<: *stub
    environment: { BQC_STUB_KIND: ai, PORT: "4102", BQC_STUB_HOST: 0.0.0.0 }
    ports: [127.0.0.1:4102:4102]
    healthcheck:
      <<: *health
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4102/__control/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  mail-stub:
    <<: *stub
    environment: { BQC_STUB_KIND: mail, PORT: "4101", BQC_STUB_HOST: 0.0.0.0 }
    ports: [127.0.0.1:4101:4101]
    healthcheck:
      <<: *health
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4101/__control/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  web:
    <<: *app
    environment: { <<: *app-environment, BETTER_AUTH_URL: http://127.0.0.1:3000, E2E: "1", BETA_E2E_EXECUTION_IDENTITY: local-playwright-e2e }
    ports: [127.0.0.1:3000:3000]
    healthcheck:
      <<: *health
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  web-locked:
    <<: *app
    environment: { <<: *app-environment, BETTER_AUTH_URL: http://127.0.0.1:3001 }
    ports: ["127.0.0.1:3001:3000"]
    healthcheck:
      <<: *health
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  worker:
    <<: *app
    command: [node, --import, ./dist-worker/worker-observability-preload.js, dist-worker/index.js]
    environment: { <<: *app-environment, BETTER_AUTH_URL: http://127.0.0.1:3000, REVIEW_PROVIDER_SUBJECT_HMAC_KEYS: "${WORKER_REVIEW_PROVIDER_SUBJECT_HMAC_KEYS}", AI_SUBJECT_HMAC_KEYS: "${WORKER_AI_SUBJECT_HMAC_KEYS}" }
    healthcheck: { <<: *health, test: [CMD, node, -e, "try{process.kill(1,0);process.exit(0)}catch{process.exit(1)}"] }
  object-store:
    profiles: [media]
    image: minio/minio@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0
    command: [server, /data]
    environment: { MINIO_ROOT_USER: "${MINIO_ROOT_USER}", MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}" }
    ports: ["127.0.0.1:4900:9000"]
    healthcheck: { <<: *health, test: [CMD, curl, -fsS, http://127.0.0.1:9000/minio/health/live] }
    volumes: [object-store-data:/data]
    networks: [app]
  object-store-init:
    profiles: [media]
    image: minio/mc@sha256:fb8f773eac8ef9d6da0486d5dec2f42f219358bcb8de579d1623d518c9ebd4cc
    depends_on: { object-store: { condition: service_healthy } }
    environment: { MINIO_ROOT_USER: "${MINIO_ROOT_USER}", MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}", S3_BUCKET_NAME: "${S3_BUCKET_NAME}" }
    entrypoint: [/bin/sh, -ec]
    command: ['mc alias set local http://object-store:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing "local/$$S3_BUCKET_NAME" && mc anonymous set none "local/$$S3_BUCKET_NAME"']
    networks: [app]
  perf-runner:
    profiles: [perf]
    <<: *app
    image: repkey-local-perf:${SOURCE_REVISION}
    build: { context: ., dockerfile: Dockerfile.perf-runner, args: { SOURCE_REVISION: "${SOURCE_REVISION}" } }
    command: [sleep, infinity]
    environment: { <<: *app-environment, BETTER_AUTH_URL: http://127.0.0.1:3000, E2E_BASE_URL: http://web:3000, PERF_ARTIFACT_DIR: /artifacts/perf }
    volumes: [./test-results/local-stack:/artifacts]
    depends_on: { web: { condition: service_healthy }, worker: { condition: service_healthy } }
networks: { app: {} }
volumes: { postgres-data: {}, redis-data: {}, object-store-data: {} }
