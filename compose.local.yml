name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

x-app-environment: &app-environment
  NODE_ENV: production
  # Local acceptance reuses one loopback address across browser cases; auth rate limits have dedicated tests.
  E2E: '1'
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  RESEND_API_KEY: ${RESEND_API_KEY}
  RESEND_BASE_URL: http://mail-stub:4101
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
  GUEST_SESSION_SALT: ${GUEST_SESSION_SALT}
  GUEST_CONTACT_ENCRYPTION_KEY: ${GUEST_CONTACT_ENCRYPTION_KEY}
  GUEST_ABUSE_HASH_SECRET: ${GUEST_ABUSE_HASH_SECRET}
  PORTAL_TOKEN_HASH_SECRET: ${PORTAL_TOKEN_HASH_SECRET}
  OPS_METRICS_TOKEN: ${OPS_METRICS_TOKEN}
  RELEASE_SHA: ${SOURCE_REVISION}
  PROCESSING_CELL: us
  OUTBOX_DISPATCHER_ENABLED: 'true'
  AWS_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  AWS_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  AWS_S3_BUCKET_NAME: ${S3_BUCKET_NAME}
  AWS_S3_REGION: us-east-1
  S3_INTERNAL_ENDPOINT: http://object-store:9000
  S3_PRESIGN_ENDPOINT: http://127.0.0.1:4900
  S3_FORCE_PATH_STYLE: 'true'
  GOOGLE_PROVIDER_ENDPOINT_PROFILE: local-sandbox
  GBP_ACCOUNT_MANAGEMENT_BASE_URL: http://provider-sandbox:4100
  GBP_API_BASE_URL: http://provider-sandbox:4100
  GBP_PERFORMANCE_BASE_URL: http://provider-sandbox:4100
  GBP_REVIEWS_API_BASE_URL: http://provider-sandbox:4100
  GBP_NOTIFICATIONS_API_BASE_URL: http://provider-sandbox:4100
  GOOGLE_OAUTH_TOKEN_URL: http://provider-sandbox:4100/oauth/token
  GOOGLE_OAUTH_USERINFO_URL: http://provider-sandbox:4100/oauth/userinfo
  GOOGLE_OAUTH_REVOKE_URL: http://provider-sandbox:4100/oauth/revoke
  LOG_LEVEL: info

x-app-runtime: &app-runtime
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: 'no'
  networks:
    - app

x-web-image: &web-image
  image: repkey-local-web:${SOURCE_REVISION}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      SOURCE_REVISION: ${SOURCE_REVISION}

services:
  postgres:
    profiles: [backend]
    image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT}:5432'
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    networks:
      - app

  redis:
    profiles: [backend]
    image: redis:7@sha256:595cc6f2bb3af6e03347b90deb6123c6aa2c81dea05ce08128de8a174b6ac67b
    command: [redis-server, --appendonly, 'yes']
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT}:6379'
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - redis-data:/data
    security_opt:
      - no-new-privileges:true
    networks:
      - app

  object-store:
    profiles: [backend]
    image: minio/minio@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:3000,http://127.0.0.1:3001,http://localhost:3000,http://localhost:3001
    ports:
      - 127.0.0.1:4900:9000
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9000/minio/health/live]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - object-store-data:/data
    security_opt:
      - no-new-privileges:true
    networks:
      - app

  object-store-init:
    profiles: [backend]
    image: minio/mc@sha256:fb8f773eac8ef9d6da0486d5dec2f42f219358bcb8de579d1623d518c9ebd4cc
    depends_on:
      object-store:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      MC_CONFIG_DIR: /tmp/.mc
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        mc alias set local http://object-store:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET_NAME"
        # Community MinIO supports cluster-wide CORS only; object-store serves one private test bucket.
        mc anonymous set none "local/$$S3_BUCKET_NAME"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: 'no'
    networks:
      - app

  provider-sandbox:
    profiles: [backend]
    image: repkey-local-provider:${SOURCE_REVISION}
    build:
      context: .
      dockerfile: Dockerfile.sandbox
      args:
        SOURCE_REVISION: ${SOURCE_REVISION}
    environment:
      BQC_STUB_KIND: gbp
      PORT: '4100'
      BQC_STUB_HOST: 0.0.0.0
    ports:
      - 127.0.0.1:4100:4100
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4100/__control/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    <<: *app-runtime

  mail-stub:
    profiles: [backend]
    image: repkey-local-provider:${SOURCE_REVISION}
    environment:
      BQC_STUB_KIND: mail
      PORT: '4101'
      BQC_STUB_HOST: 0.0.0.0
    ports:
      - 127.0.0.1:4101:4101
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4101/__control/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      provider-sandbox:
        condition: service_healthy
    <<: *app-runtime

  migrator:
    profiles: [backend]
    <<: [*web-image, *app-runtime]
    command: [node, dist-worker/migrate-deploy.js]
    environment:
      <<: *app-environment
      BETTER_AUTH_URL: http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    profiles: [backend]
    <<: [*web-image, *app-runtime]
    command: [node, dist-worker/seed-e2e-user.js]
    environment:
      <<: *app-environment
      BETTER_AUTH_URL: http://127.0.0.1:3000
      E2E_TEST_EMAIL: ${E2E_TEST_EMAIL}
      E2E_TEST_PASSWORD: ${E2E_TEST_PASSWORD}
    volumes:
      - ${STACK_E2E_DIR}:/app/e2e
    depends_on:
      migrator:
        condition: service_completed_successfully
      object-store-init:
        condition: service_completed_successfully

  web:
    profiles: [frontend]
    <<: [*web-image, *app-runtime]
    environment:
      <<: *app-environment
      BETTER_AUTH_URL: http://127.0.0.1:3000
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: '3000'
      BETA_E2E_GLOBAL_CAPABILITIES: ${E2E_WEB_CAPABILITY_OVERRIDE}
      BETA_E2E_EXECUTION_IDENTITY: ${E2E_WEB_EXECUTION_IDENTITY}
    ports:
      - 127.0.0.1:3000:3000
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health/started').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 60
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      provider-sandbox:
        condition: service_healthy
      mail-stub:
        condition: service_healthy

  web-locked:
    profiles: [frontend]
    <<: [*web-image, *app-runtime]
    environment:
      <<: *app-environment
      BETTER_AUTH_URL: http://127.0.0.1:3001
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: '3000'
      BETA_E2E_GLOBAL_CAPABILITIES: ''
      BETA_E2E_EXECUTION_IDENTITY: ''
      BETA_CAPABILITIES_OFF: ${E2E_WEB_CAPABILITY_OVERRIDE}
    ports:
      - 127.0.0.1:3001:3000
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health/started').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 60
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      provider-sandbox:
        condition: service_healthy
      mail-stub:
        condition: service_healthy

  worker:
    profiles: [backend]
    image: repkey-local-worker:${SOURCE_REVISION}
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        SOURCE_REVISION: ${SOURCE_REVISION}
    environment:
      <<: *app-environment
      BETTER_AUTH_URL: http://web:3000
      BETA_E2E_GLOBAL_CAPABILITIES: ''
      BETA_E2E_EXECUTION_IDENTITY: ''
    healthcheck:
      test:
        [CMD, node, -e, 'try{process.kill(1,0);process.exit(0)}catch{process.exit(1)}']
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      provider-sandbox:
        condition: service_healthy
      mail-stub:
        condition: service_healthy
    <<: *app-runtime

  perf-runner:
    profiles: [backend]
    image: repkey-local-perf:${SOURCE_REVISION}
    build:
      context: .
      dockerfile: Dockerfile.perf-runner
      args:
        SOURCE_REVISION: ${SOURCE_REVISION}
    command: [sleep, infinity]
    environment:
      <<: *app-environment
      BETTER_AUTH_URL: http://web:3000
      E2E_BASE_URL: http://web:3000
      PERF_ARTIFACT_DIR: /artifacts/perf
    volumes:
      - ${STACK_ARTIFACT_DIR}:/artifacts
    depends_on:
      web:
        condition: service_healthy
      worker:
        condition: service_healthy
    <<: *app-runtime

networks:
  app:
    internal: false

volumes:
  postgres-data:
  redis-data:
  object-store-data:
