name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  QUEUE_REDIS_URL: redis://queue-redis:6379
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  RESEND_API_KEY: ${RESEND_API_KEY}
  RESEND_BASE_URL: http://mail-stub:4101
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
  PROVIDER_EPHEMERAL_REDIS_URL: rediss://repkey:${PROVIDER_EPHEMERAL_REDIS_PASSWORD}@provider-redis-ingress:6379
  GOOGLE_OPAQUE_REFERENCE_HMAC_KEYS: ${GOOGLE_OPAQUE_REFERENCE_HMAC_KEYS}
  GOOGLE_REPLAY_HMAC_KEYS: ${GOOGLE_REPLAY_HMAC_KEYS}
  GOOGLE_OAUTH_STATE_HANDLE_HMAC_KEYS: ${GOOGLE_OAUTH_STATE_HANDLE_HMAC_KEYS}
  GOOGLE_SESSION_BINDING_HMAC_KEYS: ${GOOGLE_SESSION_BINDING_HMAC_KEYS}
  NOTIFICATION_UNSUBSCRIBE_HMAC_KEYS: ${NOTIFICATION_UNSUBSCRIBE_HMAC_KEYS}
  GOOGLE_CONTENT_RUNTIME_BINDINGS_JSON: ${GOOGLE_CONTENT_RUNTIME_BINDINGS_JSON}
  GOOGLE_CONTENT_APPROVAL_ROLE_PUBLIC_KEYS_JSON: ${GOOGLE_CONTENT_APPROVAL_ROLE_PUBLIC_KEYS_JSON}
  NODE_EXTRA_CA_CERTS: /run/repkey/provider-ca.crt
  GUEST_SESSION_SALT: ${GUEST_SESSION_SALT}
  GUEST_CONTACT_ENCRYPTION_KEY: ${GUEST_CONTACT_ENCRYPTION_KEY}
  GUEST_ABUSE_HASH_SECRET: ${GUEST_ABUSE_HASH_SECRET}
  PORTAL_TOKEN_HASH_SECRET: ${PORTAL_TOKEN_HASH_SECRET}
  OPS_METRICS_TOKEN: ${OPS_METRICS_TOKEN}
  RELEASE_SHA: ${SOURCE_REVISION}
  PROCESSING_CELL: us
  OUTBOX_DISPATCHER_ENABLED: 'true'
  AWS_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  AWS_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  AWS_S3_BUCKET_NAME: ${S3_BUCKET_NAME}
  AWS_S3_REGION: us-east-1
  S3_INTERNAL_ENDPOINT: http://object-store:9000
  S3_PRESIGN_ENDPOINT: http://127.0.0.1:4900
  S3_FORCE_PATH_STYLE: 'true'
  GOOGLE_PROVIDER_ENDPOINT_PROFILE: local-sandbox
  GBP_ACCOUNT_MANAGEMENT_BASE_URL: https://provider-sandbox:4100/v1
  GBP_API_BASE_URL: https://provider-sandbox:4100
  GBP_PERFORMANCE_BASE_URL: http://provider-sandbox:4100
  GBP_REVIEWS_API_BASE_URL: http://provider-sandbox:4100
  GBP_NOTIFICATIONS_API_BASE_URL: http://provider-sandbox:4100
  GOOGLE_OAUTH_TOKEN_URL: http://provider-sandbox:4100/oauth/token
  GOOGLE_OAUTH_USERINFO_URL: http://provider-sandbox:4100/oauth/userinfo
  GOOGLE_OAUTH_REVOKE_URL: http://provider-sandbox:4100/oauth/revoke
  LOG_LEVEL: info

x-ai-runtime-environment: &ai-runtime-environment
  OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-local-ai-provider-stub-not-live}
  AI_PROVIDER_LOCAL_STUB: enabled
  AI_KEY_INVENTORY_PROFILE: ${AI_KEY_INVENTORY_PROFILE}
  AI_REQUEST_BINDING_HMAC_KEYS: ${AI_REQUEST_BINDING_HMAC_KEYS}
  AI_REQUEST_BINDING_KEYRING_GENERATION: '1'
  AI_SAFETY_IDENTIFIER_HMAC_KEYS: ${AI_SAFETY_IDENTIFIER_HMAC_KEYS}
  AI_SAFETY_IDENTIFIER_KEYRING_GENERATION: '1'
  AI_ADMISSION_ED25519_PRIVATE_KEY_B64: ${AI_ADMISSION_ED25519_PRIVATE_KEY_B64}
  AI_ADMISSION_ED25519_KID: ${AI_ADMISSION_ED25519_KID}
  AI_ADMISSION_ED25519_PUBLIC_KEYS_JSON: ${AI_ADMISSION_ED25519_PUBLIC_KEYS_JSON}
  AI_ADMISSION_KEYRING_GENERATION: '1'
  AI_PROVENANCE_ED25519_PRIVATE_KEY_B64: ${AI_PROVENANCE_ED25519_PRIVATE_KEY_B64}
  AI_PROVENANCE_ED25519_KID: ${AI_PROVENANCE_ED25519_KID}
  AI_PROVENANCE_ED25519_PUBLIC_KEYS_JSON: ${AI_PROVENANCE_ED25519_PUBLIC_KEYS_JSON}
  AI_PROVENANCE_KEYRING_GENERATION: '1'
  AI_PROVIDER_DEPLOYMENT_PROFILE_VERSION: ${AI_PROVIDER_DEPLOYMENT_PROFILE_VERSION}
  AI_PROVIDER_DEPLOYMENT_PROFILE_DIGEST: ${AI_PROVIDER_DEPLOYMENT_PROFILE_DIGEST}
  AI_RUNTIME_CAPABILITY_CATALOGUE_DIGEST: ${AI_RUNTIME_CAPABILITY_CATALOGUE_DIGEST}

x-app-runtime: &app-runtime
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  volumes:
    - ${STACK_E2E_DIR}/google-runtime/ca.crt:/run/repkey/provider-ca.crt:ro
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: 'no'
  networks:
    - app
    - provider-ephemeral

x-web-image: &web-image
  image: repkey-local-web:${SOURCE_REVISION}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      SOURCE_REVISION: ${SOURCE_REVISION}

x-local-tools-image: &local-tools-image
  image: repkey-local-tools:${SOURCE_REVISION}
  build:
    context: .
    dockerfile: Dockerfile
    target: local-tools
    args:
      SOURCE_REVISION: ${SOURCE_REVISION}

services:
  postgres:
    profiles: [backend]
    image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT}:5432'
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    networks:
      - app
      - admission-data

  redis:
    profiles: [backend]
    image: redis:7@sha256:595cc6f2bb3af6e03347b90deb6123c6aa2c81dea05ce08128de8a174b6ac67b
    # Cache/rate-limit state is physically independent from BullMQ state. Keep
    # the conservative managed-service default until a bounded cache policy is
    # specified without weakening rate-limit correctness.
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT}:6379'
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - redis-data:/data
    security_opt:
      - no-new-privileges:true
    networks:
      - app

  queue-redis:
    profiles: [backend]
    image: redis:7@sha256:595cc6f2bb3af6e03347b90deb6123c6aa2c81dea05ce08128de8a174b6ac67b
    # BullMQ correctness contract: queue keys must never be evicted. Web and
    # worker independently inspect this live value before creating clients.
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    ports:
      - '127.0.0.1:${QUEUE_REDIS_HOST_PORT}:6379'
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - queue-redis-data:/data
    security_opt:
      - no-new-privileges:true
    networks:
      - app

  provider-redis:
    profiles: [backend]
    image: redis:7@sha256:595cc6f2bb3af6e03347b90deb6123c6aa2c81dea05ce08128de8a174b6ac67b
    user: '999:999'
    command: [redis-server, /run/repkey/provider-redis.conf]
    environment:
      PROVIDER_EPHEMERAL_REDIS_PASSWORD: ${PROVIDER_EPHEMERAL_REDIS_PASSWORD}
    healthcheck:
      test:
        [
          CMD-SHELL,
          'redis-cli --tls --cacert /run/repkey/ca.crt --user repkey --pass "$$PROVIDER_EPHEMERAL_REDIS_PASSWORD" ping | grep -qx PONG',
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    volumes:
      - ${STACK_E2E_DIR}/google-runtime/ca.crt:/run/repkey/ca.crt:ro
      - ${STACK_E2E_DIR}/google-runtime/provider-redis.crt:/run/repkey/provider-redis.crt:ro
      - ${STACK_E2E_DIR}/google-runtime/provider-redis.key:/run/repkey/provider-redis.key:ro
      - ${STACK_E2E_DIR}/google-runtime/provider-redis.acl:/run/repkey/provider-redis.acl:ro
      - ${STACK_E2E_DIR}/google-runtime/provider-redis.conf:/run/repkey/provider-redis.conf:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: 'no'
    networks:
      - provider-redis-data

  provider-redis-ingress:
    profiles: [backend]
    <<: *local-tools-image
    command: [node, dist-local-tools/tcp-relay.js]
    environment:
      HOST: 0.0.0.0
      PORT: '6379'
      HEALTH_PORT: '8080'
      TARGET_HOST: provider-redis
      TARGET_PORT: '6379'
      RELEASE_SHA: ${SOURCE_REVISION}
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8080').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      provider-redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: 'no'
    networks:
      - provider-ephemeral
      - provider-redis-data

  object-store:
    profiles: [backend]
    image: minio/minio@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:3000,http://127.0.0.1:3001,http://localhost:3000,http://localhost:3001
    ports:
      - 127.0.0.1:4900:9000
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9000/minio/health/live]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - object-store-data:/data
    security_opt:
      - no-new-privileges:true
    networks:
      - app

  object-store-init:
    profiles: [backend]
    image: minio/mc@sha256:fb8f773eac8ef9d6da0486d5dec2f42f219358bcb8de579d1623d518c9ebd4cc
    depends_on:
      object-store:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      MC_CONFIG_DIR: /tmp/.mc
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        mc alias set local http://object-store:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET_NAME"
        # Community MinIO supports cluster-wide CORS only; object-store serves one private test bucket.
        mc anonymous set none "local/$$S3_BUCKET_NAME"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: 'no'
    networks:
      - app

  provider-control-proxy:
    profiles: [backend]
    <<: [*local-tools-image, *app-runtime]
    command: [node, dist-local-tools/control-proxy.js]
    environment:
      HOST: 0.0.0.0
      PORT: '4100'
      PROVIDER_CONTROL_TARGET: https://provider-sandbox:4100
      RELEASE_SHA: ${SOURCE_REVISION}
      NODE_EXTRA_CA_CERTS: /run/repkey/ca.crt
    ports:
      - 127.0.0.1:4100:4100
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4100/__control/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ${STACK_E2E_DIR}/google-runtime/ca.crt:/run/repkey/ca.crt:ro
    depends_on:
      provider-sandbox:
        condition: service_healthy
    networks:
      - provider-control
      - provider-egress

  provider-sandbox:
    profiles: [backend]
    image: repkey-local-provider:${SOURCE_REVISION}
    build:
      context: .
      dockerfile: Dockerfile.sandbox
      args:
        SOURCE_REVISION: ${SOURCE_REVISION}
    environment:
      BQC_STUB_KIND: gbp
      PORT: '4100'
      BQC_STUB_HOST: 0.0.0.0
      BQC_STUB_TLS_CERT_PATH: /run/repkey/provider-sandbox.crt
      BQC_STUB_TLS_KEY_PATH: /run/repkey/provider-sandbox.key
      NODE_EXTRA_CA_CERTS: /run/repkey/ca.crt
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('https://provider-sandbox:4100/__control/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ${STACK_E2E_DIR}/google-runtime/ca.crt:/run/repkey/ca.crt:ro
      - ${STACK_E2E_DIR}/google-runtime/provider-sandbox.crt:/run/repkey/provider-sandbox.crt:ro
      - ${STACK_E2E_DIR}/google-runtime/provider-sandbox.key:/run/repkey/provider-sandbox.key:ro
    networks:
      - provider-egress
    <<: *app-runtime

  ai-provider-stub:
    profiles: [backend]
    image: repkey-local-provider:${SOURCE_REVISION}
    environment:
      BQC_STUB_KIND: ai
      PORT: '4102'
      BQC_STUB_HOST: 0.0.0.0
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const s=require('node:net').connect(4102,'127.0.0.1');s.once('connect',()=>{s.destroy();process.exit(0)});s.once('error',()=>process.exit(1));setTimeout(()=>process.exit(1),1000)",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - ai-provider-egress
    <<: *app-runtime

  mail-stub:
    profiles: [backend]
    image: repkey-local-provider:${SOURCE_REVISION}
    environment:
      BQC_STUB_KIND: mail
      PORT: '4101'
      BQC_STUB_HOST: 0.0.0.0
    ports:
      - 127.0.0.1:4101:4101
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4101/__control/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      provider-sandbox:
        condition: service_healthy
    <<: *app-runtime

  migrator:
    profiles: [backend]
    <<: [*web-image, *app-runtime]
    command: [node, dist-worker/migrate-deploy.js]
    environment:
      <<: *app-environment
      DEPLOY_MIGRATE: '1'
      BETTER_AUTH_URL: http://127.0.0.1:3000
      REVIEW_PROVIDER_SUBJECT_HMAC_MIGRATOR_KEYS: ${REVIEW_PROVIDER_SUBJECT_HMAC_MIGRATOR_KEYS}
    depends_on:
      postgres:
        condition: service_healthy

  google-admission-role:
    profiles: [backend]
    <<: *local-tools-image
    command: [node, dist-local-tools/provision-google-admission-role.js, --apply]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GOOGLE_ADMISSION_DATABASE_ROLE: repkey_google_admission_local
      GOOGLE_ADMISSION_DATABASE_PASSWORD: ${GOOGLE_ADMISSION_DATABASE_PASSWORD}
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: 'no'
    networks:
      - admission-data
    depends_on:
      migrator:
        condition: service_completed_successfully

  seed:
    profiles: [backend]
    <<: [*local-tools-image, *app-runtime]
    command: [node, dist-local-tools/seed-e2e-user.js]
    environment:
      <<: *app-environment
      LOCAL_TOOL_EXECUTION_IDENTITY: repkey-local-stack-v1
      BETTER_AUTH_URL: http://127.0.0.1:3000
      E2E_TEST_EMAIL: ${E2E_TEST_EMAIL}
      E2E_TEST_PASSWORD: ${E2E_TEST_PASSWORD}
      GOOGLE_CONTENT_LOCAL_APPROVAL_BUNDLES_JSON: ${GOOGLE_CONTENT_LOCAL_APPROVAL_BUNDLES_JSON}
    volumes:
      - ${STACK_E2E_DIR}:/app/e2e
    depends_on:
      migrator:
        condition: service_completed_successfully
      object-store-init:
        condition: service_completed_successfully

  web:
    profiles: [frontend]
    <<: [*web-image, *app-runtime]
    environment:
      <<: [*app-environment, *ai-runtime-environment]
      BETTER_AUTH_URL: http://127.0.0.1:3000
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: '3000'
      BETA_E2E_GLOBAL_CAPABILITIES: ${E2E_WEB_CAPABILITY_OVERRIDE}
      BETA_E2E_EXECUTION_IDENTITY: ${E2E_WEB_EXECUTION_IDENTITY}
      # Review §5.1: the auth rate-limit hatch lives HERE and nowhere else —
      # do NOT hoist it into x-app-environment. It disables BOTH auth
      # brute-force layers, so it is only granted to the one service that
      # needs it: this server takes the Playwright sign-in flood (every spec
      # signs in per test, ~70 POSTs in ~70s, retries: 0 makes one 429 fatal)
      # from a single loopback address. worker serves no auth HTTP at all, and
      # web-locked's entire auth traffic across the suite is ONE sign-in
      # (e2e/critical/workflows/auth-invite-only.spec.ts, e2e mode only; beta
      # mode runs beta-product-journeys against :3000 and sends web-locked
      # nothing) — far under both the shared 60-POST/60s window and
      # better-auth's 3-sign-ins/10s. In the anchor this would also refuse
      # worker boot: E2E without an execution identity is a startup violation
      # (assertE2ERateLimitBypassIdentity, src/shared/auth/beta-capabilities.ts).
      #
      # The claim is unconditional; the AUTHORIZATION is per stack mode and
      # lives in localStackEnvironment (src/shared/config/local-stack-contract.ts):
      # e2e and beta both drive a Playwright suite through this server and both
      # carry an execution identity, perf drives none and carries no identity,
      # so its claim stays refused — fail-closed, both limiters ON, logged.
      # Rate-limit behaviour itself has dedicated unit tests, no spec exercises it.
      E2E: '1'
      GOOGLE_EGRESS_GATEWAY_IDENTITY: ${GOOGLE_EGRESS_GATEWAY_IDENTITY}
      GOOGLE_ADMISSION_GRANT_HMAC_KEYS: ${GOOGLE_ADMISSION_GRANT_HMAC_KEYS}
      GOOGLE_CREDENTIAL_BINDING_HMAC_KEYS: ${GOOGLE_CREDENTIAL_BINDING_HMAC_KEYS}
    volumes:
      - ${STACK_E2E_DIR}/google-runtime/ca.crt:/run/repkey/provider-ca.crt:ro
    networks:
      - app
      - provider-ephemeral
      - provider-egress
      - ai-provider-egress
    ports:
      - 127.0.0.1:3000:3000
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health/started').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 60
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      queue-redis:
        condition: service_healthy
      provider-redis-ingress:
        condition: service_healthy
      provider-sandbox:
        condition: service_healthy
      mail-stub:
        condition: service_healthy
      ai-provider-stub:
        condition: service_healthy

  web-locked:
    profiles: [frontend]
    <<: [*web-image, *app-runtime]
    environment:
      <<: [*app-environment, *ai-runtime-environment]
      BETTER_AUTH_URL: http://127.0.0.1:3001
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: '3000'
      BETA_E2E_GLOBAL_CAPABILITIES: ''
      BETA_E2E_EXECUTION_IDENTITY: ''
      BETA_CAPABILITIES_OFF: ${E2E_WEB_CAPABILITY_OVERRIDE}
    networks:
      - app
      - provider-ephemeral
      - ai-provider-egress
    ports:
      - 127.0.0.1:3001:3000
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health/started').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 60
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      queue-redis:
        condition: service_healthy
      provider-redis-ingress:
        condition: service_healthy
      provider-sandbox:
        condition: service_healthy
      mail-stub:
        condition: service_healthy
      ai-provider-stub:
        condition: service_healthy

  worker:
    profiles: [backend]
    image: repkey-local-worker:${SOURCE_REVISION}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION}
    # One image now serves web and worker; the image CMD is the web server, so
    # the worker service supplies its own entrypoint (same command as
    # railway.worker.json `startCommand`).
    command:
      [
        'node',
        '--import',
        './dist-worker/worker-observability-preload.js',
        'dist-worker/index.js',
      ]
    environment:
      <<: [*app-environment, *ai-runtime-environment]
      # The worker never CONNECTS to this origin — it reads it as `appBaseUrl`
      # to build the links inside digest and urgent emails (see
      # digest-notification.job.ts / urgent-email.job.ts). So it must be the
      # origin a recipient can actually open, not the compose service name:
      # an email carrying http://web:3000 is broken for whoever receives it.
      # It is also why the production HTTPS guard refused this container while
      # the loopback origin the other services use is accepted.
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BETA_E2E_GLOBAL_CAPABILITIES: ''
      BETA_E2E_EXECUTION_IDENTITY: ''
      GOOGLE_EGRESS_GATEWAY_IDENTITY: ${GOOGLE_EGRESS_GATEWAY_IDENTITY}
      GOOGLE_ADMISSION_GRANT_HMAC_KEYS: ${GOOGLE_ADMISSION_GRANT_HMAC_KEYS}
      GOOGLE_CREDENTIAL_BINDING_HMAC_KEYS: ${GOOGLE_CREDENTIAL_BINDING_HMAC_KEYS}
      REVIEW_PROVIDER_SUBJECT_HMAC_KEYS: ${REVIEW_PROVIDER_SUBJECT_HMAC_KEYS}
      AI_SUBJECT_HMAC_KEYS: ${AI_SUBJECT_HMAC_KEYS}
    volumes:
      - ${STACK_E2E_DIR}/google-runtime/ca.crt:/run/repkey/provider-ca.crt:ro
    networks:
      - app
      - provider-ephemeral
      - provider-egress
      - ai-provider-egress
    healthcheck:
      test:
        [CMD, node, -e, 'try{process.kill(1,0);process.exit(0)}catch{process.exit(1)}']
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      queue-redis:
        condition: service_healthy
      provider-redis-ingress:
        condition: service_healthy
      provider-sandbox:
        condition: service_healthy
      mail-stub:
        condition: service_healthy
      ai-provider-stub:
        condition: service_healthy
    <<: *app-runtime

  perf-runner:
    profiles: [backend]
    image: repkey-local-perf:${SOURCE_REVISION}
    build:
      context: .
      dockerfile: Dockerfile.perf-runner
      args:
        SOURCE_REVISION: ${SOURCE_REVISION}
    command: [sleep, infinity]
    environment:
      <<: [*app-environment, *ai-runtime-environment]
      # Same reason as the worker: BETTER_AUTH_URL is a link-building origin and
      # must be recipient-openable. E2E_BASE_URL is different — that IS a dial
      # target, so it keeps the in-network service name.
      BETTER_AUTH_URL: http://127.0.0.1:3000
      E2E_BASE_URL: http://web:3000
      PERF_ARTIFACT_DIR: /artifacts/perf
    volumes:
      - ${STACK_ARTIFACT_DIR}:/artifacts
      - ${STACK_E2E_DIR}/google-runtime/ca.crt:/run/repkey/provider-ca.crt:ro
    networks:
      - app
      - provider-ephemeral
      - provider-egress
      - ai-provider-egress
    depends_on:
      web:
        condition: service_healthy
      worker:
        condition: service_healthy
      ai-provider-stub:
        condition: service_healthy
    <<: *app-runtime

networks:
  app:
    internal: false
  provider-control:
    internal: false
  provider-ephemeral:
    internal: true
  provider-redis-data:
    internal: true
  admission-data:
    internal: true
  provider-egress:
    internal: true
  ai-provider-egress:
    internal: true

volumes:
  postgres-data:
  redis-data:
  queue-redis-data:
  object-store-data:
