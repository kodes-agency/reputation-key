<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair:opsz,wght@5..1200,400..600&family=Sofia+Sans:wght@400;600&display=swap">
<style>
body{margin:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
a{color:#1F5E78}
:focus-visible{outline:2px solid #1F5E78;outline-offset:3px}
input[type=radio]:focus-visible + label{outline:2px solid #1F5E78;outline-offset:2px}
[tabindex="-1"]:focus-visible{outline:none}
.fo-star svg{transition:transform 120ms cubic-bezier(.2,.8,.2,1),stroke 120ms linear}
.fo-star:active svg{transform:scale(.94)}
.fo-primary{transition:background-color 120ms linear}
.fo-primary:active{transform:translateY(1px)}
.fo-outline:active{background:#ECE5D8 !important}
.fo-row{position:relative}
.fo-row::before{content:"";position:absolute;top:0;bottom:0;left:-8px;right:-8px;z-index:-1;background:#ECE5D8;opacity:0;pointer-events:none;transition:opacity 120ms linear}
.fo-row:active::before{opacity:1}
textarea::placeholder{color:#5F676A;opacity:1}
/* Hover only where a real pointer can hover: on touch screens hover sticks after a tap. */
@media (hover: hover) and (pointer: fine){
a:hover{color:#174A5F}
.fo-star:hover svg[fill="none"]{stroke:#1D2528}
.fo-primary:hover{background:#2C373B !important}
.fo-outline:hover{background:#F8F4EC !important}
.fo-text:hover{color:#174A5F !important}
.fo-row:hover::before{opacity:1}
}
/* Production note (not guest copy): below 360px the gutters become 16/16 and the star gap 4px.
   The star row sits -13px left so the first star's point meets the column edge: 5 x 56 + 4 x 4 = 296,
   so all five 56px labels fit a 320px screen in EN and BG. The caption slot is min-height 24px. */
@media (max-width: 359px){main{padding-left:16px !important;padding-right:16px !important}.fo-stars{gap:4px !important}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:0s !important;animation-duration:0s !important;animation-iteration-count:1 !important}.fo-star:active svg,.fo-primary:active{transform:none}}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; isolation: isolate; display: flex; flex-direction: column; padding: 12px 24px 0 28px; background: #F3EEE4; color: #1D2528; font-family: 'Sofia Sans', system-ui, sans-serif; font-optical-sizing: auto; font-kerning: normal;">
  <svg aria-hidden="true" focusable="false" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .03; mix-blend-mode: multiply; z-index: -1;"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>

        <a href="#" hreflang="en" aria-current="true" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; font-family: 'Sofia Sans', system-ui, sans-serif; font-weight: 600; font-size: 14px; line-height: 20px; color: #1D2528; text-decoration: underline; text-decoration-color: #1F5E78; text-decoration-thickness: 1px; text-underline-offset: 5px;">EN<span class="sr-only"> English</span></a>
        <span aria-hidden="true" style="width: 1px; height: 14px; background: #CCC3B3;"></span>
        <a href="#" hreflang="bg" lang="bg" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; font-family: 'Sofia Sans', system-ui, sans-serif; font-weight: 600; font-size: 14px; line-height: 20px; color: #4A5356; text-decoration: none;">БГ<span class="sr-only"> Български</span></a>
      </nav>
    </div>
    <div style="display: flex; flex-direction: column; gap: 20px;">

      <div aria-hidden="true" style="box-sizing: border-box; height: 6px; border-top: 2px solid #1D2528; border-bottom: 1px solid #1D2528;"></div>
    </div>

  <div style="display: flex; flex-direction: column; gap: 32px; padding-top: 32px; flex: none;">

          <legend style="padding: 0 0 20px; font-family: 'Playfair', Georgia, serif; font-weight: 400; font-size: 26px; line-height: 32px; color: #1D2528; text-wrap: balance;">How was your experience?</legend>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <div style="display: flex; flex-direction: column; gap: 6px; align-self: flex-start; margin-left: -13px;">
              <div class="fo-stars" style="position: relative; display: flex; gap: 8px;">
              <input type="radio" name="rating" value="1" id="r1" class="sr-only">
              <label for="r1" class="fo-star" style="display: flex; align-items: center; justify-content: center; flex: none; width: 56px; height: 56px; border-radius: 2px; cursor: pointer;"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#7D7F7D" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M12 2.6l2.92 5.92 6.53.95-4.72 4.6 1.11 6.5L12 17.5l-5.84 3.07 1.11-6.5-4.72-4.6 6.53-.95z"/></svg><span class="sr-only">1 star, Poor</span></label>
              <input type="radio" name="rating" value="2" id="r2" class="sr-only">
              <label for="r2" class="fo-star" style="display: flex; align-items: center; justify-content: center; flex: none; width: 56px; height: 56px; border-radius: 2px; cursor: pointer;"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#7D7F7D" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M12 2.6l2.92 5.92 6.53.95-4.72 4.6 1.11 6.5L12 17.5l-5.84 3.07 1.11-6.5-4.72-4.6 6.53-.95z"/></svg><span class="sr-only">2 stars, Fair</span></label>
              <input type="radio" name="rating" value="3" id="r3" class="sr-only">
              <label for="r3" class="fo-star" style="display: flex; align-items: center; justify-content: center; flex: none; width: 56px; height: 56px; border-radius: 2px; cursor: pointer;"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#7D7F7D" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M12 2.6l2.92 5.92 6.53.95-4.72 4.6 1.11 6.5L12 17.5l-5.84 3.07 1.11-6.5-4.72-4.6 6.53-.95z"/></svg><span class="sr-only">3 stars, Good</span></label>
              <input type="radio" name="rating" value="4" id="r4" class="sr-only">
              <label for="r4" class="fo-star" style="display: flex; align-items: center; justify-content: center; flex: none; width: 56px; height: 56px; border-radius: 2px; cursor: pointer;"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#7D7F7D" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M12 2.6l2.92 5.92 6.53.95-4.72 4.6 1.11 6.5L12 17.5l-5.84 3.07 1.11-6.5-4.72-4.6 6.53-.95z"/></svg><span class="sr-only">4 stars, Very good</span></label>
              <input type="radio" name="rating" value="5" id="r5" class="sr-only">
              <label for="r5" class="fo-star" style="display: flex; align-items: center; justify-content: center; flex: none; width: 56px; height: 56px; border-radius: 2px; cursor: pointer;"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#7D7F7D" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M12 2.6l2.92 5.92 6.53.95-4.72 4.6 1.11 6.5L12 17.5l-5.84 3.07 1.11-6.5-4.72-4.6 6.53-.95z"/></svg><span class="sr-only">5 stars, Excellent</span></label>
              </div>
              <div aria-hidden="true" style="display: flex; justify-content: space-between; padding: 0 13px; font-size: 13px; line-height: 18px; color: #5F676A;"><span>Poor</span><span>Excellent</span></div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; min-height: 24px;">
              <p id="rating-error" role="alert" style="display: flex; align-items: center; gap: 8px; margin: 0; font-weight: 600; font-size: 14px; line-height: 20px; color: #1D2528;"></p>
            </div>
          </div>
        </fieldset>
        <button type="submit" class="fo-primary" aria-describedby="privacy-line" style="display: flex; align-items: center; justify-content: center; box-sizing: border-box; width: 100%; min-height: 52px; padding: 16px 24px; border: 0; border-radius: 2px; background: #1D2528; color: #F3EEE4; font-family: 'Sofia Sans', system-ui, sans-serif; font-weight: 600; font-size: 17px; line-height: 20px; cursor: pointer;">Send privately</button>
      </div>
      <p id="privacy-line" style="margin: 0; font-size: 14px; line-height: 20px; color: #4A5356;">Shared privately with The Harbor Hotel.</p>
    </form>

    <section aria-label="Portal analytics information" style="display: flex; flex-direction: column; gap: 4px; padding-top: 15px; border-top: 1px solid #CCC3B3;">
      <p style="margin: 0; font-size: 14px; line-height: 20px; color: #4A5356; text-wrap: balance;">This page counts visits for <span style="white-space: nowrap;">The Harbor Hotel.</span> <span style="white-space: nowrap;">No ads</span> or third-party trackers.</p>
      <div style="display: flex; align-items: center; justify-content: space-between; height: 44px;">
        <a href="#" class="fo-text" style="display: flex; align-items: center; height: 44px; font-family: 'Sofia Sans', system-ui, sans-serif; font-weight: 600; font-size: 14px; line-height: 20px; color: #1F5E78; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;">Privacy notice</a>
        <button type="button" class="fo-text" style="display: flex; align-items: center; justify-content: center; box-sizing: border-box; min-width: 44px; height: 44px; padding: 0 8px; margin-right: -8px; border: 0; background: transparent; font-family: 'Sofia Sans', system-ui, sans-serif; font-weight: 600; font-size: 14px; line-height: 20px; color: #1F5E78; cursor: pointer;">Got it</button>

    </section>
  </div>

  <figure style="margin: 0; padding-top: 50px; flex: none;">
