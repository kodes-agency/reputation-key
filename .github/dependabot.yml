# Dependabot configuration — B0.4 supply chain security
# Checks for vulnerable dependencies weekly and opens PRs for updates.

version: 2
updates:
  # npm production + dev dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Group minor/patch updates to reduce PR noise
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
        # Three packages are kept OUT of the group because they can each turn a
        # "minor" bump into whole-app work, and inside a group they hold ~45
        # unrelated packages hostage. Excluded (not ignored) so each still gets
        # its OWN PR, where a red job is attributable to exactly one change.
        #
        # `vite` carries the rolldown bundler, so a minor bump can change SSR
        # chunking for the whole app. vite 8.2.1/8.2.2 (rolldown 1.2.5) emit a
        # CIRCULAR chunk graph for our server build: the route chunk reads
        # `identityKeys` from a sibling chunk that imports `router_exports` (an
        # `__exportAll` facade) back from it, so the binding is still an
        # un-initialised hoisted `var` at module-eval time and SSR dies with
        # "Cannot read properties of undefined (reading 'invitations')". That
        # takes down `e2e` and `docker` (web container never healthy). Same bug
        # class as rolldown/rolldown#8809 and #3650, unfixed in rolldown 1.2.5.
        #
        # `better-auth` OWNS the auth-table migrations (user/session/account/
        # verification are deliberately absent from the drizzle migratable
        # barrel — see src/shared/db/schema/migratable.ts), so its bumps can
        # require real schema work. better-auth 1.7.0 adds `account.issuer` as
        # `required: true` with NO default, so getMigrations() emits
        # `ALTER TABLE "account" ADD COLUMN "issuer" text NOT NULL`. Verified
        # against postgres 17: that succeeds on an empty table (so CI's fresh
        # DB only trips `check:schema-drift`, the drizzle mirror lacking the
        # column) but FAILS on any populated table with
        # `column "issuer" of relation "account" contains null values` — i.e.
        # it would break `db:migrate-deploy`, the Railway preDeployCommand.
        # Landing that needs a deliberate forward migration (add nullable,
        # backfill an issuer per provider, then set NOT NULL) plus the mirror
        # column — a data decision, not a version bump.
        #
        # `openai` is an EXACT pin (no range) because its version is attested,
        # not merely depended on. `7.4.0` appears in
        # `OPENAI_PROVIDER_DEPLOYMENT_CONTRACT_V1.sdkVersion`
        # (src/shared/ai-openai-provider-profile.ts), which the
        # `ai_provider_profiles_contract_valid` CHECK constraint compares the
        # stored `ai_provider_deployment_profiles.deployment_contract` JSONB
        # against verbatim; in `AI_GATEWAY_BUILD_ATTESTATION_V1.sdk.version`,
        # which feeds an RFC 8785 digest; and in the gateway's exact-header
        # allowlist `expectedPinnedSdkHeaders`
        # (services/ai-egress-gateway/openai-connector.ts), which refuses to
        # dispatch unless the SDK's own `user-agent: OpenAI/JS <v>` and
        # `x-stainless-package-version: <v>` match the attested version byte
        # for byte. 7.5.0 therefore turns every egress into `no_dispatch`
        # (PR #331), and landing it needs a new deployment-contract migration
        # plus a re-run of the ZDR request-shape assessment — a governance
        # decision, not a version bump.
        #
        # No pattern uses a wildcard, so `vite` matches only vite (vitest and
        # @vitejs/* stay grouped), `better-auth` only better-auth
        # (@better-auth/* stay grouped), and `openai` only openai.
        exclude-patterns:
          - vite
          - better-auth
          - openai
    # Security updates are always opened immediately regardless of schedule
    # Major version updates get individual PRs for review
    reviewers:
      - kodes-agency/engineering
    labels:
      - dependencies
      - security

  # GitHub Actions versions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    groups:
      # Sub-actions of one action repo MUST move on the same SHA.
      # codeql-action/init writes a config file stamped with its own version,
      # and codeql-action/analyze refuses to read one written by a different
      # version:
      #   Loaded a configuration file for version '4.37.7',
      #   but running version '4.37.6'
      # Ungrouped, dependabot opens one PR per sub-action (#322 init, #323
      # analyze), so EITHER merged alone breaks the required Analyze gate until
      # its sibling lands. Grouping makes the pair atomic.
      codeql-action:
        patterns:
          - github/codeql-action*
