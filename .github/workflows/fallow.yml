name: Fallow

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs of this workflow are cancelled so they stop competing for
# runners with the commit that replaced them. main is never cancelled: its runs
# gate the release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so `audit --gate new-only` can diff against the PR base.
          fetch-depth: 0

      - name: Fallow audit
        uses: fallow-rs/fallow@3cf8074a0e2e91c895c0a4224ba1c3bec4630d65 # v3.14.0
        with:
          # Combined dead-code + complexity + duplication verdict.
          # gate: new-only fails ONLY on issues the PR introduces — the
          # 192-issue regression baseline (.fallowrc.json) never blocks.
          command: audit
          gate: new-only
