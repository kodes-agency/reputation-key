name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: write
  security-events: write
jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        # BQC-7.7: digest-pinned (multi-arch index) — tag comment for humans.
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20 # 16.14
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        # BQC-7.7: digest-pinned (multi-arch index) — tag comment for humans.
        image: redis:7@sha256:595cc6f2bb3af6e03347b90deb6123c6aa2c81dea05ce08128de8a174b6ac67b # 7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # BQC-6.9: the changed-code budget diffs added src files against
          # origin/main — the check job needs full history.
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        # version intentionally unset: package.json packageManager (pnpm@10.6.5) is the single source

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # BQC-7.7: supply-chain gates — hard failures (no continue-on-error).
      # Thresholds + exception policy: docs/operations/security-ci-policy.md
      - name: Dependency vulnerability audit
        run: pnpm check:dependency-audit

      - name: License policy
        run: pnpm check:licenses

      - name: Action/image pin policy
        run: pnpm check:action-pins

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # BQC-0.1: live completion truth is the schema-validated status manifest.
      - name: BQC status manifest
        run: |
          pnpm bqc:validate-status
          pnpm bqc:generate-status
          git diff --exit-code -- \
            docs/product-readiness-program-2026-07/beta-quality-remediation-2026-07/completion-program-2026-07/STATUS.md

      - name: Run migrations
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          BETTER_AUTH_SECRET: test-secret-at-least-32-characters-long-for-ci
          BETTER_AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci-placeholder-client-id
          GOOGLE_CLIENT_SECRET: ci-placeholder-client-secret
          ENCRYPTION_KEY: aabbccddaabbccddaabbccddaabbccddaabbccddaabbccddaabbccddaabbccdd
          OAUTH_STATE_SECRET: aabbccddaabbccddaabbccddaabbccdd
        # BQC-5.4: deploy apply order — auth track, drizzle track, then the
        # registered idempotent sidecar — so the tested DB matches deploy
        # state (see src/shared/db/CONTEXT.md).
        run: |
          echo "y" | pnpm auth:migrate
          pnpm db:migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/migrations/2026-07-06-permission-version-triggers.sql

      # BQC-7.1: predeploy migration parity — the deploy runner
      # (scripts/migrate-deploy.ts, the Railway preDeployCommand) must
      # converge instantly against the DB the manual trio just migrated.
      # Exit 0 = the deploy path and the documented manual path reach the
      # same end state; guards drift between the two on every PR.
      - name: Predeploy migration parity
        env:
          NODE_ENV: test
          DEPLOY_MIGRATE: '1'
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          BETTER_AUTH_SECRET: test-secret-at-least-32-characters-long-for-ci
          BETTER_AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci-placeholder-client-id
          GOOGLE_CLIENT_SECRET: ci-placeholder-client-secret
          ENCRYPTION_KEY: aabbccddaabbccddaabbccddaabbccddaabbccddaabbccddaabbccddaabbccdd
          OAUTH_STATE_SECRET: aabbccddaabbccddaabbccddaabbccdd
        run: pnpm db:migrate-deploy

      # BQC-7.7: migration artifact consistency as a NAMED gate — the semantic
      # model↔catalog comparator (src/shared/db/schema-drift.ts) against the DB
      # the migration steps just brought to deploy state.
      - name: Schema drift (model ↔ migrated catalog)
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          BETTER_AUTH_SECRET: test-secret-at-least-32-characters-long-for-ci
          BETTER_AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci-placeholder-client-id
          GOOGLE_CLIENT_SECRET: ci-placeholder-client-secret
          ENCRYPTION_KEY: aabbccddaabbccddaabbccddaabbccddaabbccddaabbccddaabbccddaabbccdd
          OAUTH_STATE_SECRET: aabbccddaabbccddaabbccddaabbccdd
        run: pnpm check:schema-drift

      - name: Test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          BETTER_AUTH_SECRET: test-secret-at-least-32-characters-long-for-ci
          BETTER_AUTH_URL: http://localhost:3000
          RESEND_API_KEY: re_ci_test_key_placeholder
          GOOGLE_CLIENT_ID: ci-placeholder-client-id
          GOOGLE_CLIENT_SECRET: ci-placeholder-client-secret
          ENCRYPTION_KEY: aabbccddaabbccddaabbccddaabbccddaabbccddaabbccddaabbccddaabbccdd
          OAUTH_STATE_SECRET: aabbccddaabbccddaabbccddaabbccdd
        run: pnpm test

      # BQC-6.9: coverage gate — 100% on pure domain rules + the project
      # baseline ratchet. The script runs the unit project itself with v8
      # coverage (hermetic, no DB) — see scripts/check-coverage.mjs.
      - name: Coverage gate
        run: pnpm check:coverage

      # BQC-6.9: changed-code budget — every src production file added by the
      # branch must carry a colocated test (diffs against origin/main; the
      # checkout above uses fetch-depth: 0). See scripts/check-changed-code.mjs.
      - name: Changed-code budget
        run: pnpm check:changed-code

      - name: Web build
        run: pnpm build
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          BETTER_AUTH_SECRET: test-secret-at-least-32-characters-long-for-ci
          BETTER_AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci-placeholder-client-id
          GOOGLE_CLIENT_SECRET: ci-placeholder-client-secret
          ENCRYPTION_KEY: aabbccddaabbccddaabbccddaabbccddaabbccddaabbccddaabbccddaabbccdd
          OAUTH_STATE_SECRET: aabbccddaabbccddaabbccddaabbccdd

      # BQC-7.6 / STD-P1-07: booted-artifact security gate — boots the built
      # server and asserts the full B0.7 header set on 200 AND 404 responses
      # (plus x-request-id and the 413 body limit). The script generates its
      # own per-run secrets; no placeholder env is passed to the boot.
      - name: Security headers (booted artifact)
        run: pnpm check:security-headers

      # BQC-6.8: client bundle budgets on the production output (main entry /
      # initial payload / lazy chunks — see scripts/check-bundle-budget.mjs).
      - name: Bundle budget
        run: pnpm check:bundles

      - name: Worker build
        run: pnpm build:worker

      # BQC-7.1: artifact digest — deterministic tarball of the deploy
      # artifacts (sorted names, zeroed mtimes/owners, gzip -n), digest in
      # the step output and job summary as build evidence.
      - name: Artifact digest
        run: |
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - .output dist-worker \
            | gzip -n > /tmp/artifact.tgz
          DIGEST=$(shasum -a 256 /tmp/artifact.tgz | cut -d' ' -f1)
          echo "sha256:$DIGEST  (.output + dist-worker)"
          {
            echo "### Build artifact digest"
            echo "\`sha256:$DIGEST\` — .output + dist-worker (deterministic tar)"
          } >> "$GITHUB_STEP_SUMMARY"

      # BQC-7.1: source SBOM (SPDX JSON) retained as a build artifact.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 30

  # BQC-7.1: the production containers are the single deploy build path
  # (nixpacks removed) — prove both images build reproducibly on every PR
  # and run as the non-root node user.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build web image
        run: docker build -f Dockerfile -t repkey-web:ci .

      - name: Build worker image
        run: docker build -f Dockerfile.worker -t repkey-worker:ci .

      - name: Smoke images (boot + non-root + prod-deps purity)
        run: |
          docker run --rm repkey-web:ci node -e "process.exit(0)"
          docker run --rm repkey-worker:ci node -e "process.exit(0)"
          test "$(docker image inspect repkey-web:ci --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect repkey-worker:ci --format '{{.Config.User}}')" = "node"
          # BQC-7.7: production dependency/prune verification — the runtime
          # node_modules must be the prod-only install: sentinel DIRECT
          # devDependencies (vitest, typescript, eslint, prettier — see
          # package.json devDependencies) must be absent, the prod tree present.
          for img in repkey-web:ci repkey-worker:ci; do
            docker run --rm "$img" test -e /app/node_modules/pg
            for sentinel in vitest typescript eslint prettier; do
              if docker run --rm "$img" test -e "/app/node_modules/$sentinel"; then
                echo "::error::devDependency $sentinel leaked into $img prod node_modules"
                exit 1
              fi
            done
          done

      # BQC-7.7: image SBOMs (SPDX JSON, 30d retention). The images contain
      # the build outputs (.output / dist-worker), so this is ALSO the
      # artifact-content inventory scanned by grype below.
      - name: SBOM web image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: repkey-web:ci
          format: spdx-json
          output-file: sbom-web.spdx.json

      - name: SBOM worker image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: repkey-worker:ci
          format: spdx-json
          output-file: sbom-worker.spdx.json

      - name: Upload image SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-images-spdx
          path: sbom-*.spdx.json
          retention-days: 30

      # BQC-7.7: container scanning (grype) — hard fail on HIGH+ findings
      # (fail-build: true). Reviewed exceptions live in .grype.yaml with
      # owner/reason/expiry (wont-fix Debian triage + never-executed esbuild
      # CLI binaries — policy: docs/operations/security-ci-policy.md).
      # SARIF results upload to code scanning (security-events: write above).
      - name: Vulnerability scan web image (grype)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: repkey-web:ci
          fail-build: true
          severity-cutoff: high
          grype-version: v0.116.1

      - name: Vulnerability scan worker image (grype)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: repkey-worker:ci
          fail-build: true
          severity-cutoff: high
          grype-version: v0.116.1

  # BQC-7.7: secret scanning incl. full git history (gitleaks). Separate job:
  # runs in parallel with check (no pnpm install needed) and its failure is a
  # distinct required check. gitleaks-action is deliberately NOT used (org
  # license requirement) — the official image is pinned by digest instead.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history — gitleaks scans every commit, not just the PR diff.
          fetch-depth: 0

      - name: Gitleaks
        # BQC-7.7: PRs scan the PR range (sub-second-to-minutes); pushes to
        # main scan ALL refs — the full-history net (measured 8m25s for 1960
        # commits / 7.7 GB locally, acceptable on the merge path; ~2 min per
        # PR is not achievable with this history size, hence the split — see
        # docs/operations/security-ci-policy.md).
        # --config: committed .gitleaks.toml (performance allowlist for the
        # committed binary caches — see its header; NOT finding suppression).
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            OPTS="origin/${{ github.base_ref }}..HEAD"
          else
            OPTS="--all"
          fi
          echo "gitleaks log-opts: $OPTS"
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml --redact --log-opts="$OPTS"

  storybook:
    runs-on: ubuntu-latest
    # BQR-5.3: hard gate. build-storybook was soft during Vite-8/Rolldown
    # instability (storybook#33063/#33747); runner builds have been green on
    # main for BQR-5.1/5.2 — promote to hard fail. storybook-test still owns
    # component render + a11y (BQR-5.4 already covered by @storybook/addon-a11y).
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        # version intentionally unset: package.json packageManager (pnpm@10.6.5) is the single source
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Storybook
        run: pnpm build-storybook
      - name: Verify iframe.html produced
        run: test -f storybook-static/iframe.html

  storybook-test:
    runs-on: ubuntu-latest
    # Component-test coverage: boots Storybook, then runs the test-runner
    # (render + a11y checks across all stories) — hard gate for BQR-5.4 a11y.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        # version intentionally unset: package.json packageManager (pnpm@10.6.5) is the single source
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start Storybook
        run: |
          pnpm storybook --ci --quiet &
          # Robust wait without external 'wait-on' dep (avoids npx resolution flakiness/exit 127 on runners).
          for i in $(seq 1 60); do
            if curl -sf http://localhost:6006/iframe.html >/dev/null; then
              echo "Storybook ready after ${i}s"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:6006/iframe.html >/dev/null || (echo "Storybook failed to become ready" && exit 1)
      - name: Run storybook tests
        run: pnpm test-storybook

  e2e:
    runs-on: ubuntu-latest
    # BQR-5.1: critical Playwright project is a hard gate (auth + properties shell).
    # BQC-6.7: the full suite is a hard gate too — deterministic and green
    # (fake mail outbox, hydration-safe specs, F-PEOPLE fix); required for
    # release-candidate promotion.
    timeout-minutes: 25

    services:
      postgres:
        # BQC-7.7: digest-pinned (multi-arch index) — tag comment for humans.
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20 # 16.14
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Required: composition root needs Redis to build jobQueue; without it
      # /api/auth/* rate-limit path throws jobQueue required → sign-in 500s.
      redis:
        # BQC-7.7: digest-pinned (multi-arch index) — tag comment for humans.
        image: redis:7@sha256:595cc6f2bb3af6e03347b90deb6123c6aa2c81dea05ce08128de8a174b6ac67b # 7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: test-secret-at-least-32-characters-long-for-ci
      BETTER_AUTH_URL: http://localhost:3000
      RESEND_API_KEY: re_ci_test_key_placeholder
      GOOGLE_CLIENT_ID: ci-placeholder-client-id
      GOOGLE_CLIENT_SECRET: ci-placeholder-client-secret
      ENCRYPTION_KEY: aabbccddaabbccddaabbccddaabbccddaabbccddaabbccddaabbccddaabbccdd
      OAUTH_STATE_SECRET: aabbccddaabbccddaabbccddaabbccdd
      E2E_BASE_URL: http://localhost:3000
      E2E_TEST_EMAIL: test@example.com
      E2E_TEST_PASSWORD: password123
      # Open registration + team UI for this job only (not production defaults).
      # BQC-0.3: the override boots only with this explicit execution identity
      # (the dev server pins NODE_ENV=development via the dev script).
      BETA_E2E_GLOBAL_CAPABILITIES: identity.register,organization.create,team.use
      BETA_E2E_EXECUTION_IDENTITY: playwright-e2e

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        # version intentionally unset: package.json packageManager (pnpm@10.6.5) is the single source
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run migrations
        # BQC-5.4: deploy apply order — auth track, drizzle track, then the
        # registered idempotent sidecar — so the tested DB matches deploy
        # state (see src/shared/db/CONTEXT.md).
        run: |
          echo "y" | pnpm auth:migrate
          pnpm db:migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/migrations/2026-07-06-permission-version-triggers.sql
      - name: Seed E2E test user
        run: pnpm exec tsx scripts/seed-e2e-user.ts
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run critical e2e (hard gate — BQR-5.1)
        run: pnpm test:e2e --project=critical
      # BQC-6.4: retain failure diagnostics (trace/screenshot/video, written to
      # test-results/ only by failed tests). `if: failure()` is correct HERE:
      # the critical run has no continue-on-error, so its failure fails the job
      # and this fires. Playwright empties outputDir at the start of each run,
      # so this must upload before the full suite runs.
      - name: Upload critical e2e failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-critical
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Run full e2e suite (hard gate — BQC-6.7)
        id: e2e_full
        run: pnpm test:e2e --project=full
      # BQC-6.7: the full suite is a hard gate — its failure fails the job, so
      # `if: failure()` would also fire; gating on the step outcome stays more
      # precise (a skipped full run after a critical-gate failure does not
      # upload here — the critical upload above owns those artifacts).
      - name: Upload full e2e failure artifacts
        if: steps.e2e_full.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-full
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
