name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Without this, every push left the previous run of this workflow burning a
# runner: three beta-acceptance jobs ran concurrently on superseded commits and
# starved each other, so the oldest reached its 120-minute timeout without
# finishing. Superseded PR runs are cancelled; main is never cancelled, because
# its runs gate the release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read
  checks: write
  security-events: write
jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        # BQC-7.7: digest-pinned (multi-arch index) — tag comment for humans.
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20 # 16.14
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        # BQC-7.7: digest-pinned (multi-arch index) — tag comment for humans.
        image: redis:7@sha256:595cc6f2bb3af6e03347b90deb6123c6aa2c81dea05ce08128de8a174b6ac67b # 7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # BQC-6.9: the changed-code budget diffs added src files against
          # origin/main — the check job needs full history.
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # version intentionally unset: package.json packageManager (pnpm@10.6.5) is the single source

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # BQC-7.7: supply-chain gates — hard failures (no continue-on-error).
      # Thresholds + exception policy: docs/operations/security-ci-policy.md
      - name: Dependency vulnerability audit
        run: pnpm check:dependency-audit

      - name: License policy
        run: pnpm check:licenses

      - name: Action/image pin policy
        run: pnpm check:action-pins

      - name: Container image inventory and coverage policy
        run: pnpm check:container-images

      - name: Technology stack authority and reproducibility
        run: pnpm check:technology-stack

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint:ci

      - name: Run migrations
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          BETTER_AUTH_SECRET: test-secret-at-least-32-characters-long-for-ci
          BETTER_AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci-placeholder-client-id
          GOOGLE_CLIENT_SECRET: ci-placeholder-client-secret
          ENCRYPTION_KEY: aabbccddaabbccddaabbccddaabbccddaabbccddaabbccddaabbccddaabbccdd
          OAUTH_STATE_SECRET: aabbccddaabbccddaabbccddaabbccdd
        # BQC-5.4: deploy apply order — auth track, Drizzle track, the
        # autocommit concurrent-index gate, then the registered SQL sidecar —
        # so the tested DB matches deploy state (see src/shared/db/CONTEXT.md).
        run: |
          pnpm auth:migrate
          pnpm db:migrate
          pnpm db:google-property-binding-index
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/migrations/2026-07-06-permission-version-triggers.sql

      # BQC-7.1: predeploy migration parity — the deploy runner
      # (scripts/migrate-deploy.ts, the Railway preDeployCommand) must
      # converge instantly against the DB the manual sequence just migrated.
      # Exit 0 = the deploy path and the documented manual path reach the
      # same end state; guards drift between the two on every PR.
      - name: Predeploy migration parity
        env:
          NODE_ENV: test
          DEPLOY_MIGRATE: '1'
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          BETTER_AUTH_SECRET: test-secret-at-least-32-characters-long-for-ci
          BETTER_AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci-placeholder-client-id
          GOOGLE_CLIENT_SECRET: ci-placeholder-client-secret
          ENCRYPTION_KEY: aabbccddaabbccddaabbccddaabbccddaabbccddaabbccddaabbccddaabbccdd
          OAUTH_STATE_SECRET: aabbccddaabbccddaabbccddaabbccdd
          # One-run sealed migrator key. CI migrates an empty database, so the
          # provider-subject inventory has no seeded row and the initializer
          # fails closed (provider_subject_key_initialization_invalid) unless a
          # migrator key is injected exactly once — the same contract production
          # follows, with the key removed before normal services start.
          REVIEW_PROVIDER_SUBJECT_HMAC_MIGRATOR_KEYS: 'v1:cdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcd'
        run: pnpm db:migrate-deploy

      # BQC-7.7: migration artifact consistency as a NAMED gate — the semantic
      # model↔catalog comparator (src/shared/db/schema-drift.ts) against the DB
      # the migration steps just brought to deploy state.
      - name: Schema drift (model ↔ migrated catalog)
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          BETTER_AUTH_SECRET: test-secret-at-least-32-characters-long-for-ci
          BETTER_AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci-placeholder-client-id
          GOOGLE_CLIENT_SECRET: ci-placeholder-client-secret
          ENCRYPTION_KEY: aabbccddaabbccddaabbccddaabbccddaabbccddaabbccddaabbccddaabbccdd
          OAUTH_STATE_SECRET: aabbccddaabbccddaabbccddaabbccdd
        run: pnpm check:schema-drift

      # On a PR: `pnpm test` (unit + integration).
      #
      # On main: the same coverage, minus one whole duplicate unit run.
      # `check:coverage` runs the unit project itself under v8 coverage, so
      # pairing it with the integration project covers exactly what `pnpm test`
      # covers and adds the BQC-6.9 gate — 100% on pure domain rules plus the
      # two-sided baseline ratchet (floor AND staleness ceiling). Running
      # `pnpm test` and then `check:coverage` executed the unit suite twice
      # (~201s + ~135s) for one result.
      - name: Test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          BETTER_AUTH_SECRET: test-secret-at-least-32-characters-long-for-ci
          BETTER_AUTH_URL: http://localhost:3000
          RESEND_API_KEY: re_ci_test_key_placeholder
          GOOGLE_CLIENT_ID: ci-placeholder-client-id
          GOOGLE_CLIENT_SECRET: ci-placeholder-client-secret
          ENCRYPTION_KEY: aabbccddaabbccddaabbccddaabbccddaabbccddaabbccddaabbccddaabbccdd
          OAUTH_STATE_SECRET: aabbccddaabbccddaabbccddaabbccdd
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            pnpm check:coverage
            pnpm test:integration
          else
            pnpm test
          fi

      # BQC-6.9: changed-code budget — every src production file added by the
      # branch must carry a colocated test (diffs against origin/main; the
      # checkout above uses fetch-depth: 0). Measured 2-3s: the cheapest gate in
      # this job, and the only thing keeping new production code from landing
      # untested. See scripts/check-changed-code.mjs.
      - name: Changed-code budget
        run: pnpm check:changed-code

      - name: Web build
        run: pnpm build
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          BETTER_AUTH_SECRET: test-secret-at-least-32-characters-long-for-ci
          BETTER_AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: ci-placeholder-client-id
          GOOGLE_CLIENT_SECRET: ci-placeholder-client-secret
          ENCRYPTION_KEY: aabbccddaabbccddaabbccddaabbccddaabbccddaabbccddaabbccddaabbccdd
          OAUTH_STATE_SECRET: aabbccddaabbccddaabbccddaabbccdd

      # BQC-7.6 / STD-P1-07: booted-artifact security gate — boots the built
      # server and asserts the full B0.7 header set on 200 AND 404 responses
      # (plus x-request-id and the 413 body limit). The script generates its
      # own per-run secrets; no placeholder env is passed to the boot.
      - name: Security headers (booted artifact)
        run: pnpm check:security-headers

      # Built-artifact gate for the pinned reply-language runtime: cld3-asm must
      # stay external and still load + detect from inside .output/server. When
      # it gets bundled, its emscripten loader throws `runtimeModule is not a
      # function` and every reply suggestion 500s — invisible to the unit suite,
      # which injects a fake detector.
      - name: Reply-language runtime (built artifact)
        run: pnpm check:language-verifier

      # BQC-6.8: client bundle budgets on the production output (main entry /
      # initial payload / lazy chunks — see scripts/check-bundle-budget.mjs).
      - name: Bundle budget
        run: pnpm check:bundles

      - name: Worker build
        run: pnpm build:worker

      - name: AI execution admission build
        run: pnpm build:ai-execution-admission
      - name: AI egress gateway build
        run: pnpm build:ai-egress-gateway

      - name: Google execution admission build
        run: |
          pnpm build:google-execution-admission
          pnpm check:google-runtime-bundle admission

      - name: Google egress gateway build
        run: |
          pnpm build:google-egress-gateway
          pnpm check:google-runtime-bundle gateway

      - name: Google import compatibility build
        run: pnpm build:google-import-compatibility

      - name: Production artifact boundary
        run: >-
          pnpm check:production-artifacts
          .output
          dist-worker
          dist-ai-execution-admission
          dist-ai-egress-gateway
          dist-google-execution-admission
          dist-google-egress-gateway

      - name: Google import artifact boundary
        run: |
          pnpm check:google-import-artifacts final .output dist-worker
          pnpm check:google-import-artifacts compatibility dist-google-import-compatibility

      # BQC-7.1: artifact digest — deterministic tarball of the deploy
      # artifacts (sorted names, zeroed mtimes/owners, gzip -n), digest in
      # the step output and job summary as build evidence.
      - name: Artifact digest
        run: |
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - \
            .output dist-worker dist-ai-execution-admission dist-ai-egress-gateway \
            dist-google-execution-admission dist-google-egress-gateway \
            dist-google-import-compatibility \
            | gzip -n > /tmp/artifact.tgz
          DIGEST=$(shasum -a 256 /tmp/artifact.tgz | cut -d' ' -f1)
          echo "sha256:$DIGEST  (all deploy artifacts)"
          {
            echo "### Build artifact digest"
            echo "\`sha256:$DIGEST\` — all deploy artifacts (deterministic tar)"
          } >> "$GITHUB_STEP_SUMMARY"

      # BQC-7.1: source SBOM (SPDX JSON) retained as a build artifact.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 30

  # BQC-7.1: the production containers are the single deploy build path
  # (nixpacks removed) — prove every classified image builds reproducibly on
  # every PR and satisfies its explicit runtime contract.
  #
  # This job does NOT boot the Compose stack. It used to run `pnpm e2e:stack:up`
  # + `:smoke` here, byte-identical to what the `e2e` job runs — which then
  # proves the same stack with ~95 tests instead of a readiness probe. The
  # duplicate cost 171s of the critical path and asserted a strict subset.
  # Production-profile boot is therefore owned by the `e2e` job.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Plain `docker build`, deliberately. buildx with the GitHub Actions cache
      # backend was tried here and measured WORSE on two consecutive main runs:
      # build steps 135-138s -> 207s and, less obviously, the Compose stack step
      # 148-153s -> 224s. Plain `docker build` populates the local daemon's layer
      # cache, which `pnpm e2e:stack:up` later reuses inside this same job;
      # buildx's container driver builds elsewhere, so that free in-job reuse
      # disappeared while the cache export added its own cost. These images also
      # COPY changing source early, so cross-run layer reuse was low to begin
      # with. Total effect +2.7 min per push. Do not reintroduce it without
      # measuring both the build steps AND the stack step.
      #
      # Sharing built images with the `e2e` job (build once, transfer, load) was
      # costed out and rejected on arithmetic, not taste:
      #   * transfer is real weight — `docker save` of the eight compose-tagged
      #     images for one revision is 0.66 GB gzipped (measured locally), so
      #     upload + download + save + load lands around 2-3.5 min, which is
      #     already the whole e2e Compose build (169-211s).
      #   * and it would SERIALISE what is parallel today. Sharing needs
      #     `needs:`, so the critical path stops being max(docker 274s,
      #     e2e 510s) = 510s and becomes build + e2e-remainder + transfer
      #     (~210 + ~320 + ~150 = 680s). Worse by ~3 min.
      # A shared third build job has the same problem: e2e needs seven
      # compose-tagged images, so the shared build is ~210s of critical path
      # that both consumers then wait on.
      - name: Build web image
        run: docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -f Dockerfile -t repkey-web:ci .

      - name: Build worker image
        run: docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -f Dockerfile.worker -t repkey-worker:ci .

      - name: Build provider-ephemeral Redis image
        run: docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -f Dockerfile.google-provider-redis -t repkey-google-provider-redis:ci .

      - name: Build AI execution admission image
        run: docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -f Dockerfile.ai-execution-admission -t repkey-ai-execution-admission:ci .
      - name: Build AI egress gateway image
        run: docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -f Dockerfile.ai-egress-gateway -t repkey-ai-egress-gateway:ci .

      - name: Build Google execution admission image
        run: docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -f Dockerfile.google-execution-admission -t repkey-google-execution-admission:ci .
      - name: Build Google egress gateway image
        run: docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -f Dockerfile.google-egress-gateway -t repkey-google-egress-gateway:ci .

      - name: Build rollout-only Google import compatibility image
        run: docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -f Dockerfile.google-import-compatibility -t repkey-google-import-compatibility:ci .

      - name: Build provider sandbox image
        run: docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -f Dockerfile.sandbox -t repkey-provider-sandbox:ci .

      - name: Build performance runner image
        run: docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -f Dockerfile.perf-runner -t repkey-perf-runner:ci .

      - name: Smoke images (contract, non-root, prod-deps purity)
        run: |
          sh scripts/ci/smoke-provider-redis-image.sh repkey-google-provider-redis:ci
          docker run --rm repkey-web:ci node -e "process.exit(0)"
          docker run --rm repkey-worker:ci node -e "process.exit(0)"
          docker run --rm --entrypoint node repkey-google-import-compatibility:ci -e "process.exit(0)"
          docker run --rm --entrypoint node repkey-ai-execution-admission:ci -e "process.exit(0)"
          docker run --rm --entrypoint node repkey-ai-egress-gateway:ci -e "const expected={node:'22.23.2',icu:'78.2',unicode:'17.0'};for(const [key,value] of Object.entries(expected))if(process.versions[key]!==value)process.exit(1)"
          docker run --rm --entrypoint node repkey-google-execution-admission:ci -e "const expected={node:'22.23.2',icu:'78.2',unicode:'17.0'};for(const [key,value] of Object.entries(expected))if(process.versions[key]!==value)process.exit(1)"
          docker run --rm --entrypoint node repkey-google-egress-gateway:ci -e "const expected={node:'22.23.2',icu:'78.2',unicode:'17.0'};for(const [key,value] of Object.entries(expected))if(process.versions[key]!==value)process.exit(1)"
          docker run --rm --entrypoint sh repkey-provider-sandbox:ci -c 'set -eu; node provider-sandbox.mjs --kind=gbp --port=3000 >/tmp/provider-sandbox.log 2>&1 & child=$!; trap '\''kill "$child" 2>/dev/null || true; wait "$child" 2>/dev/null || true'\'' EXIT; attempt=0; until node -e "fetch('\''http://127.0.0.1:3000/__control/health'\'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; do attempt=$((attempt+1)); if [ "$attempt" -ge 30 ]; then cat /tmp/provider-sandbox.log; exit 1; fi; sleep 0.2; done'
          docker run --rm --entrypoint node repkey-perf-runner:ci dist-perf-runner/perf/load-test.js --list
          # The runtime egress probe is a separately deployed bundle with its own
          # directory and Railway start command, so it is NOT under the gateway dist.
          for governed_entry in index.js canary.js; do
            docker run --rm --entrypoint test repkey-ai-egress-gateway:ci -e "/app/dist-ai-egress-gateway/$governed_entry"
          done
          docker run --rm --entrypoint test repkey-ai-egress-gateway:ci -e /app/dist-ai-egress-probe/runtime-egress-probe.js
          test "$(docker image inspect repkey-ai-egress-gateway:ci --format '{{len .Config.Cmd}} {{join .Config.Cmd " "}}')" = "2 node dist-ai-egress-gateway/index.js"
          for img in repkey-web:ci repkey-worker:ci repkey-google-import-compatibility:ci; do
            test "$(docker image inspect "$img" --format '{{.Config.User}}')" = "node"
            docker run --rm --entrypoint test "$img" -e /app/node_modules/pg
            docker run --rm --entrypoint node "$img" -e "const p=require('/app/package.json');process.exit('scripts' in p?1:0)"
            for sentinel in vitest typescript eslint prettier; do
              if docker run --rm --entrypoint test "$img" -e "/app/node_modules/$sentinel"; then
                echo "::error::devDependency $sentinel leaked into $img prod node_modules"
                exit 1
              fi
            done
          done
          test "$(docker image inspect repkey-ai-execution-admission:ci --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect repkey-ai-egress-gateway:ci --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect repkey-google-execution-admission:ci --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect repkey-google-egress-gateway:ci --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect repkey-provider-sandbox:ci --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect repkey-perf-runner:ci --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect repkey-perf-runner:ci --format '{{len .Config.Cmd}} {{join .Config.Cmd " "}}')" = "2 sleep infinity"
          test "$(docker image inspect repkey-google-execution-admission:ci --format '{{len .Config.Cmd}} {{join .Config.Cmd " "}}')" = "2 node dist-google-execution-admission/index.js"
          test "$(docker image inspect repkey-google-egress-gateway:ci --format '{{len .Config.Cmd}} {{join .Config.Cmd " "}}')" = "2 node dist-google-egress-gateway/index.js"
          for img in repkey-ai-execution-admission:ci repkey-ai-egress-gateway:ci repkey-google-execution-admission:ci repkey-google-egress-gateway:ci; do
            docker run --rm --entrypoint test "$img" ! -e /app/node_modules
            docker run --rm --entrypoint test "$img" ! -e /app/package.json
            test "$(docker image inspect "$img" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          done
          for img in repkey-provider-sandbox:ci repkey-perf-runner:ci; do
            test "$(docker image inspect "$img" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          done
          docker run --rm --entrypoint test repkey-provider-sandbox:ci ! -e /app/node_modules
          docker run --rm --entrypoint test repkey-provider-sandbox:ci ! -e /usr/local/bin/npm
          docker run --rm --entrypoint test repkey-perf-runner:ci ! -e /app/src
          docker run --rm --entrypoint test repkey-perf-runner:ci ! -e /app/node_modules/tsx
          docker run --rm --entrypoint test repkey-perf-runner:ci ! -e /usr/local/bin/npm
          docker run --rm --entrypoint test repkey-perf-runner:ci -e /app/node_modules/pg
          docker run --rm --entrypoint node repkey-perf-runner:ci -e "const p=require('/app/package.json');process.exit('scripts' in p?1:0)"
          for entry in perf/load-test.js perf/seed-scale.js perf/seed-fleet.js perf/write-scale-evidence.js local-stack/fault-operation.js; do
            docker run --rm --entrypoint test repkey-perf-runner:ci -e "/app/dist-perf-runner/$entry"
          done
          docker run --rm --entrypoint test repkey-google-egress-gateway:ci ! -e /app/dist-google-egress-gateway/control-proxy.js
          docker run --rm --entrypoint test repkey-google-egress-gateway:ci ! -e /app/dist-google-egress-gateway/tcp-relay.js
          docker run --rm --entrypoint node \
            -v "$PWD/scripts/verify-ai-runtime-image.mjs:/tmp/verify-ai-runtime-image.mjs:ro" \
            repkey-ai-execution-admission:ci /tmp/verify-ai-runtime-image.mjs admission
          docker run --rm --entrypoint node \
            -v "$PWD/scripts/verify-ai-runtime-image.mjs:/tmp/verify-ai-runtime-image.mjs:ro" \
            repkey-ai-egress-gateway:ci /tmp/verify-ai-runtime-image.mjs gateway
          for img in repkey-web:ci repkey-worker:ci; do
            test "$(docker image inspect "$img" --format '{{index .Config.Labels "com.repkey.google-import-contract"}}')" = "final"
            test "$(docker image inspect "$img" --format '{{index .Config.Labels "com.repkey.rollout-scope"}}')" = "serving-final"
            docker run --rm --entrypoint test "$img" ! -e /app/dist-google-import-compatibility
            docker run --rm --entrypoint test "$img" ! -e /app/dist-local-tools
          done
          docker run --rm --entrypoint sh repkey-web:ci -c \
            "! find /app/.output /app/dist-worker -type f \( -name '*seed-e2e-user*' -o -name '*provision-ai-admission-role*' -o -name '*provision-google-admission-role*' \) -print | grep -q . && ! grep -R -l 'password123' /app/.output /app/dist-worker 2>/dev/null"
          docker run --rm --entrypoint sh repkey-worker:ci -c \
            "! find /app/dist-worker -type f \( -name '*seed-e2e-user*' -o -name '*provision-ai-admission-role*' -o -name '*provision-google-admission-role*' \) -print | grep -q . && ! grep -R -l 'password123' /app/dist-worker 2>/dev/null"
          test "$(docker image inspect repkey-google-import-compatibility:ci --format '{{index .Config.Labels "com.repkey.google-import-contract"}}')" = "compatibility"
          test "$(docker image inspect repkey-google-import-compatibility:ci --format '{{index .Config.Labels "com.repkey.rollout-scope"}}')" = "google-import-only"
          test "$(docker image inspect repkey-google-import-compatibility:ci --format '{{len .Config.Entrypoint}} {{join .Config.Entrypoint " "}}')" = "2 node dist-google-import-compatibility/google-import-lifecycle.js"
          {
            echo "### Governed image digests"
            for img in repkey-web:ci repkey-worker:ci repkey-google-provider-redis:ci repkey-google-import-compatibility:ci repkey-ai-execution-admission:ci repkey-ai-egress-gateway:ci repkey-google-execution-admission:ci repkey-google-egress-gateway:ci repkey-provider-sandbox:ci repkey-perf-runner:ci; do
              echo "\`$img@$(docker image inspect "$img" --format '{{.Id}}')\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # BQC-7.7: image SBOMs (SPDX JSON, 30d retention). The images contain
      # the build outputs (.output / dist-worker), so this is ALSO the
      # artifact-content inventory scanned by grype below.
      - name: SBOM web image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: repkey-web:ci
          format: spdx-json
          output-file: sbom-web.spdx.json

      - name: SBOM worker image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: repkey-worker:ci
          format: spdx-json
          output-file: sbom-worker.spdx.json

      - name: SBOM provider-ephemeral Redis image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: repkey-google-provider-redis:ci
          format: spdx-json
          output-file: sbom-google-provider-redis.spdx.json

      - name: SBOM AI execution admission image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: repkey-ai-execution-admission:ci
          format: spdx-json
          output-file: sbom-ai-execution-admission.spdx.json

      - name: SBOM AI egress gateway image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: repkey-ai-egress-gateway:ci
          format: spdx-json
          output-file: sbom-ai-egress-gateway.spdx.json

      - name: SBOM Google execution admission image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: repkey-google-execution-admission:ci
          format: spdx-json
          output-file: sbom-google-execution-admission.spdx.json

      - name: SBOM Google egress gateway image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: repkey-google-egress-gateway:ci
          format: spdx-json
          output-file: sbom-google-egress-gateway.spdx.json

      - name: SBOM Google import compatibility image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: repkey-google-import-compatibility:ci
          format: spdx-json
          output-file: sbom-google-import-compatibility.spdx.json

      - name: SBOM provider sandbox image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: repkey-provider-sandbox:ci
          format: spdx-json
          output-file: sbom-provider-sandbox.spdx.json

      - name: SBOM performance runner image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: repkey-perf-runner:ci
          format: spdx-json
          output-file: sbom-perf-runner.spdx.json

      - name: Upload image SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-images-spdx
          path: sbom-*.spdx.json
          retention-days: 30

      # BQC-7.7: container scanning (grype) — hard fail on HIGH+ findings
      # (fail-build: true). Reviewed exceptions live in .grype.yaml with
      # owner/reason/expiry (wont-fix Debian triage + never-executed esbuild
      # CLI binaries — policy: docs/operations/security-ci-policy.md).
      # SARIF results upload to code scanning (security-events: write above).
      #
      # `image:`, NOT `sbom:`. Scanning the SPDX SBOMs generated above would
      # save ~50s of duplicate syft cataloguing, and was tried here — it FAILS
      # CLOSED for the wrong reason. grype itself reports why:
      #   "go binary packages were found but none carry function symbols; go
      #    vulnerability matching falls back to module granularity and may
      #    report false positives. if scanning an SBOM, regenerate it with
      #    symbol capture enabled"
      # The SPDX document does not carry Go symbol data, so the SBOM scan
      # matched at module granularity and found HIGH+ vulnerabilities the image
      # scan does not (.grype.yaml applied identically — 142 ignores in both).
      # That is a fidelity loss, not a wash: do not reintroduce it without
      # symbol-capturing SBOMs AND a match-count comparison against main.
      #
      # cache-db: true — measured, and it is a modest steady-state win with a
      # cold-start penalty, not a free one. Three scans in the original
      # measurement, same commit:
      #   no cache      57s + 15s + 14s = 86s
      #   cold cache   62s + 24s + 24s = 110s  (nothing to restore, pays the save)
      #   warm cache   23s + 21s + 22s = 66s   (-23% vs no cache)
      # Break-even is roughly a 55% hit rate. grype publishes a new DB about
      # daily, so the first run after each publish pays the cold cost and the
      # rest of that day's runs hit. Revisit if CI volume drops to ~1 run/day.
      - name: Vulnerability scan web image (grype)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: repkey-web:ci
          fail-build: true
          severity-cutoff: high
          grype-version: v0.116.1
          cache-db: true

      - name: Vulnerability scan worker image (grype)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: repkey-worker:ci
          fail-build: true
          severity-cutoff: high
          grype-version: v0.116.1
          cache-db: true

      - name: Vulnerability scan provider-ephemeral Redis image (grype)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: repkey-google-provider-redis:ci
          fail-build: true
          severity-cutoff: high
          grype-version: v0.116.1
          cache-db: true

      - name: Vulnerability scan AI execution admission image (grype)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: repkey-ai-execution-admission:ci
          fail-build: true
          severity-cutoff: high
          grype-version: v0.116.1
          cache-db: true

      - name: Vulnerability scan AI egress gateway image (grype)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: repkey-ai-egress-gateway:ci
          fail-build: true
          severity-cutoff: high
          grype-version: v0.116.1
          cache-db: true

      - name: Vulnerability scan Google execution admission image (grype)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: repkey-google-execution-admission:ci
          fail-build: true
          severity-cutoff: high
          grype-version: v0.116.1
          cache-db: true

      - name: Vulnerability scan Google egress gateway image (grype)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: repkey-google-egress-gateway:ci
          fail-build: true
          severity-cutoff: high
          grype-version: v0.116.1
          cache-db: true

      - name: Vulnerability scan Google import compatibility image (grype)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: repkey-google-import-compatibility:ci
          fail-build: true
          severity-cutoff: high
          grype-version: v0.116.1
          cache-db: true

      - name: Vulnerability scan provider sandbox image (grype)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: repkey-provider-sandbox:ci
          fail-build: true
          severity-cutoff: high
          grype-version: v0.116.1
          cache-db: true

      - name: Vulnerability scan performance runner image (grype)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: repkey-perf-runner:ci
          fail-build: true
          severity-cutoff: high
          grype-version: v0.116.1
          cache-db: true

  # BQC-7.7: secret scanning incl. full git history (gitleaks). Separate job:
  # runs in parallel with check (no pnpm install needed) and its failure is a
  # distinct required check. gitleaks-action is deliberately NOT used (org
  # license requirement) — the official image is pinned by digest instead.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history — gitleaks scans every commit, not just the PR diff.
          fetch-depth: 0

      - name: Gitleaks
        # BQC-7.7: PRs scan the PR range (sub-second-to-minutes); pushes to
        # main scan ALL refs — the full-history net (measured 8m25s for 1960
        # commits / 7.7 GB locally, acceptable on the merge path; ~2 min per
        # PR is not achievable with this history size, hence the split — see
        # docs/operations/security-ci-policy.md).
        # --config: committed .gitleaks.toml (performance allowlist for the
        # committed binary caches — see its header; NOT finding suppression).
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            OPTS="origin/${{ github.base_ref }}..HEAD"
          else
            OPTS="--all"
          fi
          echo "gitleaks log-opts: $OPTS"
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml --redact --log-opts="$OPTS"

  storybook:
    runs-on: ubuntu-latest
    # BQR-5.3: hard gate. build-storybook was soft during Vite-8/Rolldown
    # instability (storybook#33063/#33747); runner builds have been green on
    # main for BQR-5.1/5.2 — promote to hard fail. storybook-test still owns
    # component render + a11y (BQR-5.4 already covered by @storybook/addon-a11y).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # version intentionally unset: package.json packageManager (pnpm@10.6.5) is the single source
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Storybook
        run: pnpm build-storybook
      - name: Verify iframe.html produced
        run: test -f storybook-static/iframe.html

  storybook-test:
    runs-on: ubuntu-latest
    # Component-test coverage: boots Storybook, then runs the test-runner
    # (render + a11y checks across all stories) — hard gate for BQR-5.4 a11y.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # version intentionally unset: package.json packageManager (pnpm@10.6.5) is the single source
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium was downloaded from scratch in every job that needs it. Key the
      # cache on the resolved @playwright/test version so a bump invalidates it.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browser
        run: >-
          ${{ steps.pw-cache.outputs.cache-hit == 'true'
          && 'pnpm exec playwright install-deps chromium'
          || 'pnpm exec playwright install --with-deps chromium' }}
      - name: Start Storybook
        run: |
          pnpm storybook --ci --quiet &
          # Robust wait without external 'wait-on' dep (avoids npx resolution flakiness/exit 127 on runners).
          for i in $(seq 1 60); do
            if curl -sf http://localhost:6006/iframe.html >/dev/null; then
              echo "Storybook ready after ${i}s"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:6006/iframe.html >/dev/null || (echo "Storybook failed to become ready" && exit 1)
      - name: Run storybook tests
        run: pnpm test-storybook

  e2e:
    runs-on: ubuntu-latest
    # BQR-5.1: critical Playwright project is a hard gate (auth + properties shell).
    # BQC-6.7: the full suite is a hard gate too — deterministic and green
    # (fake mail outbox, hydration-safe specs, F-PEOPLE fix); required for
    # release-candidate promotion.
    timeout-minutes: 25

    env:
      CI: '1'
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_LOCKED_BASE_URL: http://127.0.0.1:3001

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # version intentionally unset: package.json packageManager (pnpm@10.6.5) is the single source
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The release browser matrix is cached on the resolved Playwright version;
      # a dependency bump therefore replaces Chromium, Firefox, and WebKit as
      # one coherent test runtime.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright release browsers
        run: >-
          ${{ steps.pw-cache.outputs.cache-hit == 'true'
          && 'pnpm exec playwright install-deps chromium firefox webkit'
          || 'pnpm exec playwright install --with-deps chromium firefox webkit' }}
      - name: Start local Compose application stack
        run: pnpm e2e:stack:up
      - name: Smoke local Compose application stack
        run: pnpm e2e:stack:smoke
      - name: Run critical e2e (hard gate — BQR-5.1)
        id: e2e_critical
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/e2e-critical-report.json
        run: pnpm test:e2e --project=critical ${{ github.event_name == 'push' && '--fail-on-flaky-tests' || '' }}
      # BQC-6.4: retain failure diagnostics (trace/screenshot/video, written to
      # test-results/playwright/ only by failed tests). `if: failure()` is correct HERE:
      # the critical run has no continue-on-error, so its failure fails the job
      # and this fires. Playwright empties outputDir at the start of each run,
      # so this must upload before the full suite runs.
      - name: Upload critical e2e failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-critical
          path: test-results/playwright/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Run full e2e suite (hard gate — BQC-6.7)
        id: e2e_full
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/e2e-full-report.json
        run: pnpm test:e2e --project=full ${{ github.event_name == 'push' && '--fail-on-flaky-tests' || '' }}
      # BQC-6.7: the full suite is a hard gate — its failure fails the job, so
      # `if: failure()` would also fire; gating on the step outcome stays more
      # precise (a skipped full run after a critical-gate failure does not
      # upload here — the critical upload above owns those artifacts).
      - name: Upload full e2e failure artifacts
        if: steps.e2e_full.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-full
          path: test-results/playwright/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Run bounded browser and mobile compatibility gate
        id: e2e_compatibility
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/e2e-compatibility-report.json
        run: pnpm test:e2e:compatibility ${{ github.event_name == 'push' && '--fail-on-flaky-tests' || '' }}
      - name: Upload exact browser reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-browser-reports
          path: |
            test-results/e2e-critical-report.json
            test-results/e2e-full-report.json
            test-results/e2e-compatibility-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload compatibility failure artifacts
        if: steps.e2e_compatibility.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-compatibility
          path: test-results/playwright/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Collect local Compose diagnostics
        if: always()
        run: pnpm e2e:stack:logs
      - name: Upload local stack evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-local-stack-evidence
          path: test-results/local-stack/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down local Compose application stack
        if: always()
        run: pnpm e2e:stack:down

  # Final controlled-beta gate. beta:smoke owns the hermetic beta-profile
  # Compose cycles for clean/upgrade/scale/fault/product evidence; the final
  # down step is a defensive cleanup if the orchestrator is interrupted.
  #
  # NOT run on every PR commit. It was 86% of this workflow's wall clock
  # (median 58 min against ~10 min for everything else combined) while gating
  # nothing — main carries no branch protection. It now runs on every push to
  # main, so release evidence is unchanged, and on demand for a PR carrying the
  # `beta-acceptance` label when a change needs the full hermetic run before it
  # merges.
  beta-acceptance:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'beta-acceptance')
    needs: [check, docker, storybook, storybook-test, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        # BQC-7.7: digest-pinned (multi-arch index) — tag comment for humans.
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20 # 16.14
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        # BQC-7.7: digest-pinned (multi-arch index) — tag comment for humans.
        image: redis:7@sha256:595cc6f2bb3af6e03347b90deb6123c6aa2c81dea05ce08128de8a174b6ac67b # 7.4.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: '1'
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_LOCKED_BASE_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium was downloaded from scratch in every job that needs it. Key the
      # cache on the resolved @playwright/test version so a bump invalidates it.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browser
        run: >-
          ${{ steps.pw-cache.outputs.cache-hit == 'true'
          && 'pnpm exec playwright install-deps chromium'
          || 'pnpm exec playwright install --with-deps chromium' }}
      - name: Run authoritative local beta smoke
        run: pnpm beta:smoke -- --release-sha=${{ github.sha }}
      - name: Resolve beta manifest digest
        id: beta_manifest
        shell: bash
        run: |
          shopt -s nullglob
          checksums=(test-results/beta-smoke/"$GITHUB_SHA"/*/manifest.sha256)
          test "${#checksums[@]}" -eq 1
          manifest_dir="$(dirname "${checksums[0]}")"
          echo "digest=$(basename "$manifest_dir")" >> "$GITHUB_OUTPUT"
      - name: Collect beta Compose diagnostics
        if: always()
        run: pnpm exec tsx scripts/local-stack/stack.ts logs --mode=beta
      - name: Upload beta smoke evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta-local-smoke-${{ steps.beta_manifest.outputs.digest || github.sha }}
          path: |
            test-results/beta-smoke/**
            test-results/beta-smoke-work/**
            test-results/local-stack/**
            test-results/playwright/**
          if-no-files-found: ignore
          overwrite: false
          retention-days: 30
      - name: Tear down beta Compose stack
        if: always()
        run: pnpm local:beta:down
