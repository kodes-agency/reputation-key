name: Browser matrix

# The read-only compatibility journeys (e2e/compatibility) in every browser the
# product supports. A pull request runs the Chromium journeys and the Android
# viewport (ci.yml, `browser`); Firefox, WebKit and the iOS viewport run here,
# once a week and on demand, against a stack built from the same Dockerfile.
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # expected ~10 min

    env:
      CI: '1'
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_LOCKED_BASE_URL: http://127.0.0.1:3001

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # version intentionally unset: package.json packageManager (pnpm@10.6.5) is the single source
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The cache key names the browser set as well as the Playwright version,
      # so a job that needs one browser never restores a directory that holds
      # only another's.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-firefox-webkit
      - name: Install Playwright release browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: pnpm exec playwright install chromium firefox webkit
      - name: Week of the Ubuntu package cache
        id: apt-week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore Ubuntu packages for Playwright
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt
          key: playwright-apt-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-firefox-webkit_${{ steps.apt-week.outputs.week }}
          restore-keys: playwright-apt-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-firefox-webkit_
      - name: Install Playwright system packages
        timeout-minutes: 10
        run: PLAYWRIGHT_DEPS_CACHE_DIR="$HOME/.cache/playwright-apt" sh scripts/ci/install-playwright-deps.sh chromium firefox webkit
      - name: Save Ubuntu packages for Playwright
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - name: Start local Compose application stack
        run: pnpm e2e:stack:up
      - name: Run the browser compatibility matrix
        id: e2e_compatibility
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/e2e-compatibility-report.json
        run: pnpm test:e2e:compatibility --fail-on-flaky-tests
      - name: Upload compatibility failure artifacts
        if: steps.e2e_compatibility.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-matrix-artifacts
          path: test-results/playwright/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload exact browser report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-matrix-report
          path: test-results/e2e-compatibility-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Collect local Compose diagnostics
        if: always()
        run: pnpm e2e:stack:logs
      - name: Upload local stack evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-matrix-stack-evidence
          path: test-results/local-stack/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down local Compose application stack
        if: always()
        run: pnpm e2e:stack:down
