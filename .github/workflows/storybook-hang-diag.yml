# Temporary diagnostic for the intermittent storybook-test hang in
# portal-editor.stories.tsx. Runs only on pushes to diag/storybook-hang*.
name: storybook-hang-diag

on:
  push:
    branches: ['diag/storybook-hang*']

permissions:
  contents: read

jobs:
  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: copies, shard: 1 }
          - { mode: copies, shard: 2 }
          - { mode: copies, shard: 3 }
          - { mode: copies, shard: 4 }
          - { mode: copies, shard: 5 }
          - { mode: copies, shard: 6 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install Playwright browser
        run: >-
          ${{ steps.pw-cache.outputs.cache-hit == 'true'
          && 'pnpm exec playwright install-deps chromium'
          || 'pnpm exec playwright install --with-deps chromium' }}
      - name: Run storybook tests under the watchdog
        run: >-
          ./scripts/ci/storybook-hang-diag.sh ${{ matrix.mode }}
          ${{ matrix.mode == 'full' && '4 900' || '6 600' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: traces-${{ matrix.mode }}-${{ matrix.shard }}
          path: trace-*.txt
          if-no-files-found: ignore
