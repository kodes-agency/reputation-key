name: CodeQL

# BQC-7.7: static security analysis (CodeQL). Public repo → code scanning is
# free; SARIF uploads use the security-events permission below. Findings land
# as code-scanning alerts (Security tab); a failed ANALYSIS is a hard gate
# (no continue-on-error) — see docs/operations/security-ci-policy.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly full re-scan (new queries/CVE classes land between PRs).
  schedule:
    - cron: '24 5 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # BQC-7.7: SARIF upload to code scanning (pre-provisioned for this).
      security-events: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: javascript-typescript
          # security-extended = the security suite + medium-precision findings.
          queries: security-extended

      # javascript-typescript needs no build (extractor build-mode: none).
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
